<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funktionsgraphen verändern</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#19343d;font:17px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:22px}h1{font-size:30px;margin:0 0 8px}h2{font-size:19px;margin:10px 0}p{line-height:1.5}.intro{margin:0 0 20px;color:#52676e}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px}aside,.panel{background:white;padding:20px}.plot{background:white;overflow:hidden;min-height:480px}select,button,input{font:inherit}select{width:100%;padding:10px;background:white;border:1px solid #a7bcc2;border-radius:5px}button{padding:10px 12px;border:1px solid #b8c9cd;border-radius:5px;background:white;color:#19343d;cursor:pointer;margin:6px 6px 0 0}button.primary{background:#006f79;color:white}fieldset{border:0;padding:0;margin:0}fieldset:disabled{opacity:.5}label{display:block;margin:14px 0 8px}input[type=range]{width:100%;accent-color:#006f79;min-height:30px}input[type=number]{width:90px;float:right;padding:5px;border:1px solid #b8c9cd;border-radius:4px}.math{font:24px Cambria,Georgia,serif;line-height:1.6;overflow-wrap:anywhere}.small{font-size:14px;color:#52676e}.legend{display:flex;flex-wrap:wrap;gap:18px;padding:12px 0}.source{color:#697680}.new{color:#006f79}.formula{margin:14px 0}.points{padding-top:8px;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px;margin-top:10px}th,td{padding:9px;border:1px solid #c7d3d7;text-align:center}th{background:#eef4f5}#feedback{min-height:40px;margin-top:15px;font-weight:600}#loading{padding:20px}#switches{display:flex;gap:15px;flex-wrap:wrap}#switches label{font-size:15px}details{margin-top:15px}summary{cursor:pointer}.hidden,[hidden]{display:none!important}#tasklabel{margin-top:0} @media(max-width:950px){.layout{grid-template-columns:1fr}aside{order:-1}.plot{min-height:420px}main{padding:12px}#sliders{display:flex;gap:20px;flex-wrap:wrap}#sliders>div{flex:1;min-width:180px}}
</style><main><h1>Funktionsgraphen verändern</h1><p class="intro">Zum Arbeitsblatt vom 11.11.2026 · Erst vermuten und im Heft notieren, dann ausprobieren.</p><div class="layout"><section><div class="legend" id="legend"><span class="source">━ Ausgangsgraph f</span><span class="new">┄ Veränderter Graph g</span></div><div class="plot" id="plot"><div id="loading" role="status">GeoGebra wird geladen …</div><div id="ggb"></div></div><div class="panel"><div id="switches" hidden></div><div class="points" id="points"></div><details id="tablebox"><summary>Wertetabelle zur Kontrolle</summary><div class="scroll" id="values"></div></details><p id="remark" class="small"></p></div></section><aside><label id="tasklabel" for="task">Aufgabe vom Arbeitsblatt</label><select id="task"></select><p id="assignment"></p><div id="base" class="math"></div><fieldset id="controls" disabled><div id="sliders"></div><label id="showlabel"><input type="checkbox" id="showterm"> Meinen Funktionsterm anzeigen</label><div id="formula" class="math formula" hidden></div><button class="primary" id="check">Einstellung prüfen</button><button id="reset">Zurücksetzen</button><div id="feedback" aria-live="polite"></div><details><summary>Hilfe</summary><p id="help"></p></details></fieldset></aside></div></main>
<script>
const tasks=[
{id:'1a',name:'1a · Nach oben',text:'Verschiebe f(x) = x² um 4 Einheiten nach oben.',a:1,c:0,d:4,mode:'d'},
{id:'1b',name:'1b · Nach links',text:'Verschiebe f(x) = x² um 3 Einheiten nach links.',a:1,c:-3,d:0,mode:'c'},
{id:'1c',name:'1c · Zwei Verschiebungen',text:'Verschiebe f(x) = x² um 2 nach rechts und 1 nach unten.',a:1,c:2,d:-1,mode:'cd'},
{id:'1d',name:'1d · Bereits verschobene Parabel',text:'Ausgangspunkt ist f(x) = (x − 1)². Verschiebe diesen Graphen um weitere 2 Einheiten nach links.',b:1,a:1,c:-2,d:0,mode:'c'},
{id:'2',name:'2a–c · Vier Graphen vergleichen',text:'Vergleiche x², 2x², 0,5x² und −x². Blende Graphen einzeln ein und aus. Prüfe deine Wertetabelle und Zeichnung.',kind:'compare'},
{id:'3a1',name:'3a(1) · Faktor 3',text:'Erzeuge g(x) = 3x² aus f(x) = x². Beschreibe die Veränderung.',a:3,c:0,d:0,mode:'a'},
{id:'3a2',name:'3a(2) · Faktor 0,25',text:'Erzeuge h(x) = 0,25x². Vergleiche die y-Werte mit den Werten von f.',a:.25,c:0,d:0,mode:'a'},
{id:'3a3',name:'3a(3) · Faktor −2',text:'Erzeuge k(x) = −2x². Welche beiden Veränderungen erkennst du?',a:-2,c:0,d:0,mode:'a'},
{id:'3b1',name:'3b(1) · Punkte und Faktor 2',text:'P(−2 | 3) und Q(1 | −2) liegen auf einem nicht näher bestimmten Graphen. Untersuche ihre neuen Positionen bei g(x) = 2f(x).',kind:'points',pts:[[-2,3],[1,-2]],a:2,c:0,d:0,mode:'a'},
{id:'3b2',name:'3b(2) · Punkte und Faktor −0,5',text:'Verändere P(−2 | 3) und Q(1 | −2) entsprechend h(x) = −0,5f(x).',kind:'points',pts:[[-2,3],[1,-2]],a:-.5,c:0,d:0,mode:'a'},
{id:'3c',name:'3c · Milas Aussage prüfen',text:'Mila sagt: „Bei g(x) = 2f(x) verdoppeln sich die x-Koordinaten.“ Stelle a = 2 ein und beobachte P und P′. Formuliere die richtige Regel.',pts:[[1,1]],a:2,c:0,d:0,mode:'a'},
{id:'4a',name:'4a · Verschieben und strecken',text:'Ausgehend von x²: erst 1 nach rechts, dann mit Faktor 2 in y-Richtung strecken, zuletzt 3 nach oben. Stelle die Regler in dieser Reihenfolge ein.',a:2,c:1,d:3,mode:'cad'},
{id:'4b',name:'4b · Verschieben und spiegeln',text:'Ausgehend von x²: erst 2 nach links, dann an der x-Achse spiegeln, zuletzt 1 nach unten.',a:-1,c:-2,d:-1,mode:'cad'},
{id:'5a',name:'5a · Abschlusscheck: Graph',text:'Bearbeite den Abschlusscheck zunächst ohne Applet. Kontrolliere danach die Veränderung von x² zu −3x².',a:-3,c:0,d:0,mode:'a'},
{id:'5b',name:'5b · Abschlusscheck: Punkt',text:'Kontrolliere, wohin P(2 | 4) bei g(x) = 0,5f(x) gelangt.',kind:'points',pts:[[2,4]],a:.5,c:0,d:0,mode:'a'},
{id:'5c',name:'5c · Abschlusscheck: Kombination',text:'Kontrolliere deinen Term: 1 nach rechts, in y-Richtung mit Faktor 2 strecken, dann 3 nach oben.',a:2,c:1,d:3,mode:'cad'},
{id:'extra',name:'Zusatzaufgabe',text:'Erzeuge g(x) = −0,5(x − 2)² + 1. Kontrolliere den Scheitelpunkt und die Funktionswerte bei x = 0 und x = 4.',a:-.5,c:2,d:1,mode:'cad'},
{id:'free',name:'Freies Experimentieren',text:'Verändere f(x) = x². Untersuche jeweils nur einen Regler und beschreibe seine Wirkung. Die Reihenfolge lautet: horizontal verschieben, in y-Richtung verändern, vertikal verschieben.',a:1,c:0,d:0,mode:'cad'}];
const $=id=>document.getElementById(id);let api,t=tasks[0],v={a:1,c:0,d:0};const fmt=x=>String(Math.round(x*100)/100).replace('.',',').replace('-','−');const sign=x=>x<0?' − '+fmt(-x):x>0?' + '+fmt(x):'';
for(const x of tasks)$('task').add(new Option(x.name,x.id));
for(const [k,label,min,max,step] of [['c','c · horizontal verschieben',-5,5,.5],['a','a · y-Werte multiplizieren',-3,3,.25],['d','d · vertikal verschieben',-5,5,.5]]){const div=document.createElement('div');div.id='row'+k;div.innerHTML=`<label for="${k}">${label}</label><input id="num${k}" aria-label="Wert für ${k}" type="number" min="${min}" max="${max}" step="${step}"><input id="${k}" aria-label="Regler ${k}" type="range" min="${min}" max="${max}" step="${step}">`;$('sliders').append(div);for(const id of [k,'num'+k])$(id).addEventListener('input',()=>{if($(id).value==='')return;let n=Number($(id).value);if(!Number.isFinite(n)||n<min||n>max)return;v[k]=Math.round(n/step)*step;update();$('feedback').textContent='';});}
const colors={f:[105,118,128],g:[0,111,121],h:[152,74,140],k:[180,91,32]};
function style(n,col,dash=0,label=false){api.setColor(n,...col);api.setLineThickness(n,5);api.setLineStyle(n,dash);api.setFixed(n,true,false);api.setLabelVisible(n,label);api.evalCommand(`SetTooltipMode(${n},2)`);}
function add(cmd){if(!api.evalCommand(cmd))throw new Error('GeoGebra: '+cmd);}
function expr(){const center=(t.b||0)+v.c;return v.a===0?fmt(v.d):(v.a===1?'':v.a===-1?'−':fmt(v.a)+' · ')+(center===0?'x':'(x'+sign(-center)+')')+'<sup>2</sup>'+sign(v.d);}
function update(){for(const k of ['a','c','d']){$(k).value=v[k];$('num'+k).value=v[k];api.setValue(k,v[k]);}const pointOnly=t.kind==='points';$('formula').innerHTML=pointOnly?'<i>g</i>(<i>x</i>) = '+fmt(v.a)+' · <i>f</i>(<i>x</i>)':'<i>g</i>(<i>x</i>) = '+expr();$('formula').hidden=!$('showterm').checked||t.kind==='compare';let pts=t.pts||[];let lines=pts.map((p,i)=>`${i?'Q':'P'}(${fmt(p[0])} | ${fmt(p[1])}) → ${i?'Q':'P'}′(${fmt(p[0]+v.c)} | ${fmt(v.a*p[1]+v.d)})`);if(!pointOnly&&t.kind!=='compare')lines.unshift(v.a===0?'g ist konstant und hat keinen eindeutigen Scheitelpunkt.':`Scheitelpunkt von g: S(${fmt((t.b||0)+v.c)} | ${fmt(v.d)})`);$('points').textContent=lines.join(' · ');drawTable();}
function drawTable(){if(t.kind==='points'){let rows=(t.pts||[]).map((p,i)=>`<tr><th>${i?'Q':'P'}</th><td>${fmt(p[0])}</td><td>${fmt(p[1])}</td><td>${fmt(p[0]+v.c)}</td><td>${fmt(v.a*p[1]+v.d)}</td></tr>`).join('');$('values').innerHTML='<table><tr><th>Punkt</th><th>x</th><th>y</th><th>x neu</th><th>y neu</th></tr>'+rows+'</table>';return;}const xs=t.id==='extra'?[-2,-1,0,1,2,3,4]:[-2,-1,0,1,2];let rows=t.kind==='compare'?[['f(x) = x²',x=>x*x],['g(x) = 2x²',x=>2*x*x],['h(x) = 0,5x²',x=>.5*x*x],['k(x) = −x²',x=>-x*x]]:[['f(x)',x=>(x-(t.b||0))**2],['g(x)',x=>v.a*(x-v.c-(t.b||0))**2+v.d]];$('values').innerHTML='<table><tr><th>x</th>'+xs.map(x=>'<th>'+fmt(x)+'</th>').join('')+'</tr>'+rows.map(([name,fn])=>'<tr><th>'+name+'</th>'+xs.map(x=>'<td>'+fmt(fn(x))+'</td>').join('')+'</tr>').join('')+'</table>';}
function load(){t=tasks.find(x=>x.id===$('task').value);api.setRepaintingActive(false);for(const n of api.getAllObjectNames())api.deleteObject(n);v={a:1,c:0,d:0};add('a=1\nc=0\nd=0');for(const k of ['a','c','d'])api.setVisible(k,false);$('showterm').checked=false;$('tablebox').open=false;$('feedback').textContent='';$('switches').innerHTML='';$('switches').hidden=t.kind!=='compare';$('assignment').textContent=t.text;for(const k of ['a','c','d'])$('row'+k).hidden=!(t.mode||'').includes(k);$('check').hidden=t.kind==='compare'||t.id==='free';$('showlabel').hidden=t.kind==='compare';$('base').innerHTML=t.kind==='points'?'Punktveränderung bei g(x) = a · f(x)':t.b?'f(x) = (x − 1)<sup>2</sup>':'f(x) = x<sup>2</sup>';
if(t.kind==='compare'){for(const [n,ex] of [['f','x^2'],['g','2x^2'],['h','0.5x^2'],['k','-x^2']]){add(`${n}(x)=${ex}`);style(n,colors[n],n==='h'?1:n==='k'?2:0);const l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked> ${n}(x)`;l.style.color='rgb('+colors[n].join(',')+')';l.firstChild.onchange=e=>api.setVisible(n,e.target.checked);$('switches').append(l);}$('legend').innerHTML='Vier Graphen vergleichen';}
else{if(t.kind!=='points'){add(`f(x)=(x-${t.b||0})^2`);add('g(x)=a*f(x-c)+d');style('f',colors.f);style('g',colors.g,1);add(`S=(${t.b||0},0)`);add(`T=(${t.b||0}+c,d)`);style('S',colors.f,0,true);style('T',colors.g,0,true);api.evalCommand('SetConditionToShowObject(T,a!=0)');api.setCaption('T','S′');api.setLabelStyle('T',3);}for(const [i,pt] of (t.pts||[]).entries()){const n=i?'Q':'P';add(`${n}=(${pt[0]},${pt[1]})`);add(`${n}new=(${pt[0]}+c,a*(${pt[1]})+d)`);style(n,colors.f,0,true);style(n+'new',colors.g,0,true);api.setCaption(n+'new',n+'′');api.setLabelStyle(n+'new',3);api.setPointSize(n,5);api.setPointSize(n+'new',5);}$('legend').innerHTML=t.kind==='points'?'<span class="source">● Ausgangspunkte</span><span class="new">● Veränderte Punkte</span>':'<span class="source">━ Ausgangsgraph f</span><span class="new">┄ Veränderter Graph g</span>';}
$('remark').textContent=t.kind==='points'?'Die beiden Punkte bestimmen keinen eindeutigen Funktionsgraphen. Deshalb werden hier nur die gegebenen Punkte verändert.':t.id==='1d'?'c beschreibt die zusätzliche Verschiebung des Ausgangsgraphen. Dessen Scheitel liegt bereits bei x = 1.':'Vergleiche deine Beobachtungen mit dem Merkkasten auf dem Arbeitsblatt.';
$('help').textContent='c > 0: nach rechts, c < 0: nach links. Der Faktor a multipliziert die y-Werte. Bei a < 0 wird zusätzlich an der x-Achse gespiegelt. Zum Schluss verschiebt d nach oben oder unten. Bei a = 0 entsteht eine konstante Funktion.';
api.setCoordSystem(-5,5,-6,9);api.setAxesVisible(true,true);api.setGridVisible(true);update();api.setRepaintingActive(true);}
$('task').onchange=()=>{if(api)load();};$('showterm').onchange=()=>update();$('reset').onclick=()=>load();$('check').onclick=()=>{let ok=['a','c','d'].every(k=>Math.abs(v[k]-t[k])<1e-9);$('feedback').textContent=ok?(t.id==='3c'?'Richtig eingestellt: Nur die y-Koordinaten verdoppeln sich. Die x-Koordinaten bleiben gleich.':'Die Einstellung passt. Notiere Term, Punkte und Beschreibung im Heft.'):'Die Einstellung passt noch nicht. Vergleiche die Regler mit dem Auftrag.';};
window.start=()=>{const app=new GGBApplet({appName:'classic',id:'worksheetGGB',width:Math.max(300,$('plot').clientWidth),height:window.innerWidth<950?420:480,language:'de',showToolBar:false,showMenuBar:false,showAlgebraInput:false,enableRightClick:false,enableLabelDrags:false,enableShiftDragZoom:false,allowStyleBar:false,showResetIcon:false,appletOnLoad:a=>{api=a;window.worksheetAPI=a;api.setPerspective('G');load();$('loading').hidden=true;$('controls').disabled=false;}},true);app.inject('ggb');};
window.fail=()=>{$('loading').textContent='GeoGebra konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.';};
</script><script src="https://www.geogebra.org/apps/deployggb.js" onload="start()" onerror="fail()"></script></html>
