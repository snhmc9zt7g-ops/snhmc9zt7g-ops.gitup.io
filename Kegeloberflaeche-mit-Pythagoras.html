p:.5rem;margin:.7rem 0}.hint-list li{background:#f4f6fa;border-left:3px solid #91a4bd;padding:.7rem 1rem;border-radius:0 8px 8px 0}.help-row{margin-top:.8rem}.help-row button{font-size:.85rem}.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1rem}.nav-status{font-size:.83rem;color:var(--muted);text-align:center;max-width:26rem}.nav button{flex-shrink:0}.mode-buttons{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.mode-buttons [aria-pressed=true]{background:#174fb5;color:white}.notice{padding:.8rem 1rem;border:1px solid #c8d6e9;background:#f4f7fd;border-radius:10px;font-size:.9rem}details{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}summary{min-height:30px;font-weight:650}details[open] summary{margin-bottom:.8rem}.overlay{position:fixed;inset:0;z-index:50;background:#13263d88;display:flex;align-items:center;justify-content:center;padding:1rem}.modal{background:white;border-radius:16px;padding:1.7rem;max-width:580px;width:100%;max-height:90vh;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.7rem;margin-top:1rem}[hidden]{display:none!important}.strategy{padding-left:1.5rem}.strategy li{margin:.4rem 0}.memory{font-size:1.1rem;line-height:1.75;background:#eef3fc;border:1px solid #c1d2ee;border-radius:12px;padding:1.25rem}.complete-banner{background:#183f75;color:white;padding:1.2rem;border-radius:12px;margin:1rem 0}.complete-banner h3{color:white}.footer{font-size:.75rem;color:var(--muted);max-width:1254px;margin:0 auto;padding:1rem;text-align:center}.svg-hit{stroke:transparent;stroke-width:28;cursor:pointer}.svg-edge:focus-visible{outline:none}.svg-edge:focus-visible .svg-hit{stroke:#c96b0066}.svg-edge:hover .svg-hit{stroke:#174fb519}.inline-steps{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;font-size:.95rem}.inline-steps span{background:#f1f5fa;padding:.3rem .65rem;border-radius:6px}.svg-note{font-size:.85rem;color:var(--muted)}

<script>
'use strict';
const KEY='kegel-lernweg-interaktiv-v3';
const titles=['Dreieck & Ansatz','Vom Kegel zur Oberfläche','Rechnungen prüfen','Selbstständig anwenden','Abschluss & Merksatz'];
const times=['4 Minuten','5 Minuten','4 Minuten','6 Minuten','4 Minuten'];
const fresh=()=>({v:1,current:0,done:{},values:{},attempts:{},hints:{},review:{},cameras:{},view:2,self:'',extras:false});
let state=fresh(),persist=true,returnFocus=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.done&&s.values&&s.hints&&s.attempts&&Number.isInteger(s.current)&&s.current>=0&&s.current<5)state=Object.assign(fresh(),s);}catch(e){persist=false;}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const numeric=x=>{const t=String(x).trim().replace(/\s/g,'').replace(/cm(?:²|\^2|2)?$/i,'').replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t)?Number(t):NaN};
const near=(a,b,t=.005000001)=>Number.isFinite(a)&&Math.abs(a-b)<=t;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persist=true;}catch(e){persist=false;}$('storageNote').textContent=persist?'Offline · Fortschritt nur in diesem Browser gespeichert · Keine Übertragung':'Offline · Fortschritt bleibt während dieser Sitzung erhalten; dauerhaftes Speichern ist hier nicht verfügbar.';}
const unit=(id='unit',label='Einheit des Oberflächeninhalts')=>({id,label,type:'select',options:[['cm','cm'],['cm2','cm²'],['cm3','cm³']],answer:'cm2',error:'Der Oberflächeninhalt ist eine Fläche und benötigt deshalb eine Quadrateinheit: cm².'});
const num=(id,label,answer,extra={})=>({id,label,type:'number',answer,...extra});
const sel=(id,label,options,answer,error)=>({id,label,type:'select',options,answer,error});
const tasks={};
function add(t){tasks[t.id]=t;return t.id;}
function cone(mode=2,unknown=false,interactive=false){return `<figure class="diagram"><svg viewBox="0 0 420 350" role="${interactive?'group':'img'}" aria-label="Gerader Kreiskegel mit Spitze A, Grundflächenmittelpunkt Z und Randpunkt B. AZ ist senkrecht zu ZB. AZ ist die Höhe, ZB der Radius, AB die Mantellinie."><path d="M70 282 L210 40 L350 282" fill="#edf2f9" stroke="#6d8098" stroke-width="2"/><path d="M70 282 C70 234 350 234 350 282" fill="none" stroke="#8697ab" stroke-width="2" stroke-dasharray="6 5"/><path d="M70 282 C70 330 350 330 350 282" fill="none" stroke="#6d8098" stroke-width="2"/>${mode>=1?'<path d="M70 282 L210 40 L350 282 Z" fill="#9cb8e52b" stroke="#7b8da5" stroke-dasharray="6 5"/>':''}${mode>=2?'<path d="M210 40 L210 282 L350 282 Z" fill="#bfd4f47a"/>':''}
${edge('1',210,40,210,282,'#087147','7 5',interactive)}${edge('2',210,282,350,282,'#a22262','4 4',interactive)}${edge('3',210,40,350,282,'#174fb5','',interactive)}<path d="M210 263 L229 263 L229 282" fill="none" stroke="#253b53" stroke-width="2"/><circle cx="218" cy="274" r="2" fill="#253b53"/><circle cx="210" cy="282" r="3.5" fill="#253b53"/><text x="205" y="26">A</text><text x="190" y="306">Z</text><text x="358" y="290">B</text><text x="165" y="174" class="h">${unknown?'①':'h'}</text><text x="275" y="308" class="r">${unknown?'②':'r'}</text><text x="295" y="160" class="s">${unknown?'③':'s'}</text>${mode>=1?'<text x="115" y="308" style="font-size:16px">r</text>':''}</svg><figcaption>${mode===0?'Gerader Kreiskegel · Darstellung nicht maßstabsgetreu':mode===1?'Axialschnitt: Die ganze Breite ist 2r.':'Halber Axialschnitt: Die Kathete ZB ist nur r.'} Verdeckte Strecken sind gestrichelt.</figcaption></figure>`;}
function edge(id,x1,y1,x2,y2,color,dash,inter){return `<g ${inter?`class="svg-edge" role="button" tabindex="0" data-edge="${id}" aria-label="Strecke ${id} als Hypotenuse wählen"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:''}/>${inter?`<line class="svg-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`:''}</g>`;}
function generalHints(r,h){const s=Math.hypot(r,h),G=Math.PI*r*r,M=Math.PI*r*s;return [cone(2)+'Das Dreieck besteht aus Radius r, Höhe h und Mantellinie s.','Es fehlt die schräge Mantellinie s. Sie ist die Hypotenuse.','Für die Mantellinie gilt s = √(r² + h²).',`Setze ein: s = √(${r}² + ${h}²) = √(${r*r+h*h}). Nutze das Ergebnis im Taschenrechner weiter.`,`Musterhilfe: s = √(${r*r+h*h}) ≈ ${fmt(s)} cm; G = π · ${r}² ≈ ${fmt(G)} cm²; M = π · ${r} · √(${r*r+h*h}) ≈ ${fmt(M)} cm²; O = G + M ≈ ${fmt(G+M)} cm². Gerechnet wird mit ungerundeten Werten.`];}
function calcFields(r,h,full=true){const s=Math.hypot(r,h),G=Math.PI*r*r,M=Math.PI*r*s;return [...(full?[num('s','Mantellinie s in cm',s,{wrong:[[r*r+h*h,'Du hast s² berechnet. Gesucht ist die Länge s. Ziehe noch die Quadratwurzel.'],[Math.hypot(2*r,h),'Du hast den Durchmesser verwendet. Die Kathete reicht vom Mittelpunkt zum Rand: Verwende r.']]}),num('G','Grundfläche G in cm²',G),num('M','Mantelfläche M in cm²',M,{wrong:[[Math.PI*r*h,'Für die Mantelfläche brauchst du die schräge Strecke s. Die Höhe h liegt im Inneren des Kegels.']]})]:[]),num('O','Oberflächeninhalt O',G+M,{wrong:[[G+Math.PI*r*h,'Für die Mantelfläche brauchst du s statt h. Berechne zuerst s = √(r² + h²).'],[M,'Das ist nur die Mantelfläche. Addiere noch die Grundfläche πr².']]}),unit()];}
function surface(r,h){return Math.PI*r*(r+Math.hypot(r,h));}
function fullSolution(r,h){return `s = √(${r}² + ${h}²) = √${r*r+h*h} ≈ ${fmt(Math.hypot(r,h))} cm; G = π · ${r}² ≈ ${fmt(Math.PI*r*r)} cm²; M = π · ${r} · √${r*r+h*h} ≈ ${fmt(Math.PI*r*Math.hypot(r,h))} cm²; O = G + M ≈ ${fmt(surface(r,h))} cm². Für die Weiterrechnung bleiben die Zwischenwerte ungerundet.`;}
add({id:'triangle',title:'Vom räumlichen Modell zum Rechenansatz',body:'Stelle mit den Auswahlfeldern die passende Pythagoras-Gleichung zusammen. Begründe im Heft, warum bei Z ein rechter Winkel liegt und die waagerechte Kathete nur r lang ist.',fields:[sel('hyp','Linke Seite: Hypotenuse²',[['1','h²'],['2','r²'],['3','s²']],'3','Die Hypotenuse liegt dem rechten Winkel gegenüber. Im Dreieck AZB ist das die Mantellinie s.'),sel('leg1','Rechte Seite: erste Kathete²',[['r','r²'],['h','h²'],['s','s²']],'r','Die beiden Katheten sind r und h. Die Reihenfolge beim Addieren ist beliebig.'),sel('leg2','+ zweite Kathete²',[['r','r²'],['h','h²'],['s','s²']],'h','Verwende r und h jeweils einmal; ihre Quadrate werden addiert.')],solution:'s² = r² + h², also s = √(r² + h²). h steht senkrecht auf der Grundfläche und damit auf r. Deshalb liegt bei Z ein rechter Winkel. ZB ist der Radius, nicht der Durchmesser. Beim Drehen bleiben Längen und Winkel des Körpers unverändert; nur ihre Projektion auf dem Bildschirm ändert sich.',hints:['Nutze „Dreieck frontal“, wenn die räumliche Ansicht unübersichtlich ist.','Die Hypotenuse berührt den rechten Winkel nicht.','Im halben Axialschnitt sind r und h die Katheten; s ist die Hypotenuse.']});
add({id:'basic',title:'A · Eine vollständige Rechnung',body:'Ein gerader Kreiskegel hat r = 3 cm und h = 4 cm. Berechne im Heft zuerst s, dann G und M und schließlich O. Digital prüfst du nur die entscheidenden Ergebnisse s und O. So bleibt dein Rechenweg zusammenhängend und du musst nicht jede Zeile doppelt eingeben.',fields:[calcFields(3,4)[0],...calcFields(3,4,false)],solution:fullSolution(3,4),hints:generalHints(3,4)});
add({id:'transfer',title:'B · Ohne ganzzahlige Mantellinie',body:'Für einen zweiten Kegel gilt r = 2 cm und h = 3 cm. Berechne die Mantellinie und den gesamten Oberflächeninhalt einschließlich Grundfläche. Den Lösungsweg organisierst du selbst; G und M werden hier nicht mehr einzeln abgefragt.',fields:[calcFields(2,3)[0],...calcFields(2,3,false)],solution:fullSolution(2,3),hints:generalHints(2,3)});
const errorReasons=[['radius','A · Kathete im Axialschnitt'],['root','B · Quadrat und Länge'],['slant','C · Strecke in der Mantelformel'],['area','D · Flächeneinheit']];
add({id:'errorChain',title:'Vier Notizen prüfen',body:'Für r = 3 cm und h = 4 cm liegen vier <b>voneinander unabhängige</b> Notizen vor. Jede enthält einen typischen Fehler. Verbessere die vier Aussagen zuerst kurz im Heft. Ordne anschließend die passende Begründung zu:<ul class="reason-key"><li><b>A:</b> Die Kathete reicht nur vom Mittelpunkt zum Rand.</li><li><b>B:</b> Gesucht ist die Länge, nicht ihr Quadrat.</li><li><b>C:</b> Die Mantelfläche benötigt die schräge Strecke.</li><li><b>D:</b> Eine Fläche benötigt eine Quadrateinheit.</li></ul>',fields:[sel('radius','① s² = 6² + 4²',errorReasons,'radius','Die waagerechte Kathete ist r = 3 cm. 6 cm ist der gesamte Durchmesser.'),sel('root','② s² = 25 cm², also s = 25 cm',errorReasons,'root','Aus s² = 25 cm² folgt durch Wurzelziehen s = 5 cm.'),sel('slant','③ M = π · 3 · 4',errorReasons,'slant','4 cm ist h. Für M = πrs brauchst du s = 5 cm.'),sel('area','④ O ≈ 75,40 cm',errorReasons,'area','O bezeichnet eine Fläche. Daher lautet die Einheit cm².')],solution:'① s² = 3² + 4² = 25 cm²: r statt 2r. ② s = √25 = 5,00 cm: Wurzelziehen nicht vergessen. ③ M = π · 3 · 5 ≈ 47,12 cm²: s statt h. ④ O ≈ 75,40 cm²: Quadrateinheit. Vergleiche diese Korrekturen mit deinen eigenen Begründungen im Heft.',hints:['Prüfe jede Notiz für sich. Die Fehler sollen nicht als Folgefehler weitergerechnet werden.','Nutze das Dreieck für ① und ② sowie die Oberflächenformel für ③ und ④.']});
add({id:'rounding',title:'Rundungsstrategien beurteilen',body:`Für r = 2 cm und h = 3 cm rechnet Mia mit s = 3,6 cm weiter. Noah setzt √13 direkt in die Oberflächenformel ein. Vergleiche beide Rechenwege im Heft und entscheide begründet, welcher Weg vorzuziehen ist. Du musst das bereits berechnete Ergebnis nicht noch einmal eintippen.`,fields:[{id:'why',type:'radio',label:'Deine Beurteilung',options:[['keep','Noahs Weg: Die ungerundete Mantellinie verhindert einen vermeidbaren Rundungsfehler im Endergebnis.'],['same','Beide Wege sind gleich genau, weil am Schluss auf zwei Nachkommastellen gerundet wird.'],['short','Mias Weg ist genauer, weil die Mantellinie weniger Nachkommastellen hat.']],answer:'keep',error:'Das Runden am Ende kann einen vorher entstandenen Rundungsfehler nicht rückgängig machen.'}],solution:`Mit s = √13 ist O = 4π + 2π√13 ≈ ${fmt(surface(2,3))} cm². Mit s = 3,6 erhält Mia dagegen ${fmt(Math.PI*4+Math.PI*2*3.6)} cm². Noahs Weg bewahrt die Genauigkeit bis zum Endergebnis.`,hints:['Berechne beide Ergebnisse mit der π-Taste und vergleiche sie.','Ein gerundeter Zwischenwert wird bei der Multiplikation weiterverwendet. Sein Fehler verschwindet nicht durch erneutes Runden.']});
add({id:'practice1',title:'A · Selbstständig rechnen',body:'Ein gerader Kreiskegel hat r = 4,5 cm und h = 8 cm. Bestimme seinen gesamten Oberflächeninhalt einschließlich Grundfläche. Notiere einen nachvollziehbaren Rechenweg im Heft. Hier werden nur Ergebnis und Einheit geprüft.',fields:calcFields(4.5,8,false),solution:fullSolution(4.5,8),hints:generalHints(4.5,8)});
add({id:'compare',title:'B · Zwei Kegel vergleichen',body:'Zwei geschlossene Kegel sollen vollständig beklebt werden. Kegel A: r = 3 cm, h = 8 cm. Kegel B: r = 4 cm, h = 5 cm. Ein Schüler behauptet: „Der höhere Kegel braucht mehr Folie.“ Vermute zunächst, welcher Kegel mehr Folie benötigt. Prüfe die Behauptung dann mit beiden Oberflächeninhalten und begründe deine Entscheidung im Heft. Kein Verschnitt.',fields:[num('OA','Oberflächeninhalt von Kegel A',surface(3,8)),num('OB','Oberflächeninhalt von Kegel B',surface(4,5)),unit('unit','Einheit für beide Flächenwerte'),sel('larger','Welcher Kegel benötigt mehr Folie?',[['A','Kegel A'],['B','Kegel B'],['same','Beide gleich viel']],'B','Die Höhe allein entscheidet nicht. Der Radius beeinflusst sowohl Grundfläche als auch Mantelfläche.')],solution:`A: s = √73 cm und O = 9π + 3π√73 ≈ ${fmt(surface(3,8))} cm². B: s = √41 cm und O = 16π + 4π√41 ≈ ${fmt(surface(4,5))} cm². Kegel B braucht ${fmt(surface(4,5)-surface(3,8))} cm² mehr Folie. Die Behauptung ist falsch: Auch der Radius bestimmt die Oberfläche. Die Differenz ist hier nur eine zusätzliche Information; für die Entscheidung reicht der Vergleich der Oberflächen.`,hints:['Berechne für jeden Kegel eine eigene Mantellinie.','A: s = √(3² + 8²). B: s = √(4² + 5²).','Vergleiche beide vollständigen Oberflächen. Eine größere Höhe allein bedeutet noch keine größere Oberfläche.']});
add({id:'extra1',title:'Extra 1 · Durchmesser & Zusatzangabe',body:'Eine geschlossene kegelförmige Dose hat einen Durchmesser von 10 cm und eine senkrechte Höhe von 12 cm. Sie wiegt 80 g. Wie groß ist ihre gesamte Außenfläche einschließlich Boden? Die Wanddicke wird vernachlässigt.',fields:[num('r','Radius in cm',5,{wrong:[[10,'10 cm ist der Durchmesser. Der Radius ist halb so groß.']]}),...calcFields(5,12,false),sel('unused','Welche Angabe wird nicht benötigt?',[['mass','Die Masse von 80 g.'],['height','Die Höhe von 12 cm.'],['diam','Der Durchmesser von 10 cm.']],'mass','Für die Oberfläche brauchst du die Abmessungen, nicht die Masse.')],solution:'r = d : 2 = 5,00 cm; s = √(5² + 12²) = 13,00 cm. O = π · 5² + π · 5 · 13 = 90π ≈ 282,74 cm². Die Angabe 80 g ist überflüssig.',hints:['Halbiere zuerst den Durchmesser.',...generalHints(5,12)]});
add({id:'extra2',title:'Extra 2 · Rundungsstrategien beurteilen',body:`Für r = 4 cm und h = 7 cm rechnet Tom mit s = 8,06 cm weiter und erhält O ≈ ${fmt(Math.PI*16+Math.PI*4*8.06)} cm². Sara setzt direkt √65 ein und erhält O ≈ ${fmt(Math.PI*16+Math.PI*4*Math.sqrt(65))} cm².`,fields:[sel('who','Welcher Weg ist genauer?',[['tom','Toms Weg'],['sara','Saras Weg'],['same','Beide Wege sind exakt gleich.']],'sara','√65 erhält die volle Genauigkeit der Mantellinie bis zum Endergebnis.'),sel('why','Warum?',[['unrounded','Sara verwendet die ungerundete Mantellinie.'],['smaller','Ein größeres Ergebnis ist immer genauer.'],['pi','Tom hat π vergessen.']],'unrounded','Entscheidend ist, ob der Zwischenwert gerundet wurde.')],solution:`Beide verwenden die richtige Formel. Toms frühe Rundung verändert aber die Hundertstelstelle. Mit s = √65 ergibt sich O ≈ ${fmt(Math.PI*16+Math.PI*4*Math.sqrt(65))} cm².`,hints:['Prüfe, welcher Wert bei der Mantellinie mehr Genauigkeit bewahrt.']});
add({id:'finalTask',title:'Eine Verpackung rundum bekleben',body:'Eine geschlossene Verpackung hat die Form eines geraden Kreiskegels. Ihr Radius beträgt 3,5 cm, ihre senkrechte Höhe 9 cm. Die gesamte Außenfläche einschließlich des kreisförmigen Bodens soll beklebt werden. Wie viel Folie wird mindestens benötigt? Überlappungen und Verschnitt werden nicht berücksichtigt. Entwickle und notiere deinen vollständigen Rechenweg im Heft.',fields:calcFields(3.5,9,false),solution:fullSolution(3.5,9),hints:generalHints(3.5,9)});
const groups=[['triangle'],['basic','transfer'],['errorChain','rounding'],['practice1','compare'],['finalTask']];

const stationDone=i=>groups[i].every(id=>state.done[id])&&(i!==4||!!state.self);
function allowedStation(){let n=0;while(n<4&&stationDone(n))n++;return n;}
state.current=Math.min(state.current,allowedStation());
const merksatz='Sind bei einem geraden Kreiskegel der Radius r und die Höhe h gegeben, berechne ich zuerst die Mantellinie s = √(r² + h²). Danach setze ich r und s in O = πr² + πrs ein. Ich rechne mit ungerundeten Zwischenwerten, runde das Endergebnis auf zwei Nachkommastellen und gebe eine Flächeneinheit an.';
function fieldHTML(t,f){const key=t.id+'_'+f.id,value=state.values[key]??'';
if(f.type==='radio')return `<fieldset class="choice-set full-width"><legend>${f.label}</legend>${f.options.map(([v,l])=>`<label class="choice"><input type="radio" name="${key}" value="${v}" ${value===v?'checked':''}>${l}</label>`).join('')}</fieldset>`;
return `<label for="${key}">${f.label}${f.type==='select'?`<select id="${key}" name="${key}" aria-describedby="fb_${t.id}"><option value="">Bitte wählen …</option>${f.options.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('')}</select>`:`<input type="text" inputmode="${f.type==='equation'?'text':'decimal'}" autocomplete="off" spellcheck="false" id="${key}" name="${key}" value="${esc(value)}" aria-describedby="fb_${t.id}">`}</label>`;}
function completionFeedback(id){const t=tasks[id],status=state.done[id];if(!status)return '';const intro=status==='supported'?'Mit Lösungsvergleich bearbeitet. Die App hat deine ursprüngliche Antwort nicht als richtig bestätigt.':status==='rounding'?'Die Zahlen liegen nahe am Musterergebnis. Prüfe die kleine Rundungsabweichung im Vergleich:':'Die eingegebenen Ergebnisse passen. Vergleiche jetzt auch deinen Rechenweg:';return `<strong>${intro}</strong> ${t.solution}`;}
function reviewHTML(id){if(state.done[id]||!(state.attempts[id]>=2))return '';return `<div class="review-route"><p class="small">Du kommst trotz Hilfe nicht weiter? Vergleiche deinen Ansatz mit dem Lösungsweg. So bleibst du nicht an einer Eingabe hängen.</p>${state.review[id]?`<div class="notice">${tasks[id].solution}</div><label class="choice"><input type="checkbox" id="reviewConfirm_${id}">Ich habe meinen Rechenweg verglichen und die nötigen Korrekturen im Heft nachvollzogen.</label><button type="button" data-review-done="${id}">Als mit Hilfe bearbeitet markieren</button><p id="reviewFeedback_${id}" role="status"></p>`:`<button type="button" data-review-open="${id}">Lösungsweg vergleichen</button>`}</div>`;}
function taskHTML(id){const t=tasks[id],done=state.done[id],h=state.hints[id]||0;return `<section class="card" id="card_${id}" aria-labelledby="title_${id}"><h3 tabindex="-1" id="title_${id}">${t.title}${done?' <span class="small">✓ bearbeitet</span>':''}</h3>${t.body?`<div class="task-body">${t.body}</div>`:''}${id==='compare'?explorer('compare'):''}<form data-task="${id}" novalidate><fieldset class="${done==='supported'?'unconfirmed':''}" ${done?'disabled':''}><legend class="task-kicker">${done?(done==='supported'?'Mit Lösungsvergleich':'Bearbeitet'):'Deine Antwort'}</legend><div class="${t.fields[0].type==='radio'?'':'fields'}">${t.fields.map(f=>fieldHTML(t,f)).join('')}</div>${id==='triangle'?'<output id="relationPreview" class="formula math" aria-live="polite">□² = □² + □²</output>':''}<button class="primary" type="submit">Antwort prüfen</button></fieldset><div class="feedback ${done==='supported'?'reviewed':done==='rounding'?'rounding':done?'good':''}" id="fb_${id}" role="status" aria-live="polite" aria-atomic="true">${completionFeedback(id)}</div></form><div class="help-row" id="help_${id}">${helpHTML(id,h)}</div><div id="review_${id}">${reviewHTML(id)}</div></section>`;}
function helpHTML(id,h){const t=tasks[id],all=t.hints.concat(t.hints[t.hints.length-1]===t.solution?[]:[`Lösungsweg: ${t.solution}`]);return `<ol class="hint-list">${all.slice(0,h).map((x,i)=>`<li><b>Hilfe ${i+1}</b><br>${x}</li>`).join('')}</ol>${!state.done[id]&&h<all.length?`<button type="button" data-hint="${id}" aria-controls="help_${id}">${h?'Nächste Hilfe':state.attempts[id]>=2?'Zusätzliche Hilfe öffnen':'Hilfe öffnen'} <span class="muted">(${h+1}/${all.length})</span></button>`:''}`;}
function sequence(ids){let html='';for(const id of ids){html+=taskHTML(id);if(!state.done[id])break;}return html;}
function render(focus=false){const n=state.current,complete=stationDone(n),count=titles.filter((_,i)=>stationDone(i)).length;
$('progressText').textContent=`${count} von 5 bearbeitet`;$('percent').textContent=`${Math.round(count/5*100)} %`;$('progress').value=count;
$('stationList').innerHTML=titles.map((t,i)=>`<li class="${i===n?'active ':''}${stationDone(i)?'done':''}" ${i===n?'aria-current="step"':''}><span class="num" aria-hidden="true">${stationDone(i)?'✓':i+1}</span><span class="station-name">${t}</span><span class="small" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Station ${i+1}: ${t}${stationDone(i)?', abgeschlossen':''}</span></li>`).join('');
let body='';
if(n===0)body=`<p>Du kennst O = πr² + πrs. Wie bestimmst du s, wenn nur r und h gegeben sind?</p><p class="notice"><b>Beobachtungsauftrag:</b> Drehe die Ansicht kurz. Bleibt der Winkel zwischen r und h rechtwinklig, auch wenn er auf dem Bildschirm anders aussieht? Prüfe das in „Dreieck frontal“.</p>${explorer('intro')}${taskHTML('triangle')}`;
if(n===1)body=`<p>Verbinde Pythagoras mit der bekannten Oberflächenformel. Bearbeite jeweils die ganze Rechnung und prüfe deine Ergebnisse gemeinsam.</p><div class="notice">Nutze den Taschenrechner. Runde erst die Ergebnisse auf zwei Nachkommastellen; verwende Zwischenwerte ungerundet weiter. Hilfen und Formelkarte kannst du bei Bedarf öffnen.</div>${sequence(groups[1])}${stationDone(1)?'<div class="notice"><b>Ein zusammenhängender Weg:</b> s = √(r² + h²), dann O = πr² + πrs. Du kannst G und M getrennt berechnen oder direkt in die Oberflächenformel einsetzen.</div>':''}`;
if(n===2)body=`<p>Prüfe vollständige Rechnungen. Korrigiere die Fehler und begründe deine Entscheidungen.</p>${sequence(groups[2])}`;
if(n===3)body=`<p>Plane deine Rechenschritte selbst. Halte die vollständigen Lösungen im Heft fest. Die Hilfen bleiben freiwillig.</p>${sequence(groups[3])}${stationDone(3)?`<section class="card"><h3>Mehr Herausforderung?</h3><p>Du kannst zum Abschluss gehen oder freiwillig weiterdenken. Zusatzzeit: etwa 3–5 Minuten.</p><button id="extrasBtn" aria-expanded="${state.extras}" aria-controls="extras">${state.extras?'Zusatzaufgaben schließen':'Zusatzaufgaben öffnen'}</button><div id="extras" ${state.extras?'':'hidden'}>${taskHTML('extra1')}${taskHTML('extra2')}</div></section>`:''}`;
if(n===4)body=taskHTML('finalTask')+(state.done.finalTask?`<section class="card"><p class="eyebrow">Das bleibt</p><h3>Deine Strategie in sechs Schritten</h3><ol class="strategy"><li>Rechtwinkliges Dreieck im halben Axialschnitt erkennen.</li><li>Mantellinie mit Pythagoras berechnen: s = √(r² + h²).</li><li>Grundfläche G = πr² und Mantelfläche M = πrs berechnen.</li><li>Flächen addieren: O = G + M.</li><li>Das Ergebnis auf zwei Nachkommastellen runden.</li><li>Die passende Flächeneinheit angeben.</li></ol><h3>Merksatz fürs Heft</h3><p class="memory" id="memory">${merksatz}</p><button id="copyBtn">Merksatz kopieren</button><p id="copyStatus" role="status" aria-live="polite" class="small muted"></p></section><section class="card"><h3>Wie sicher bist du?</h3><p class="small muted">Deine Einschätzung bleibt nur auf diesem Gerät. Es gibt keine Übermittlung an deine Lehrkraft.</p><fieldset class="choice-set"><legend>Wähle die Aussage, die gerade zu dir passt.</legend>${[['alone','Ich kann den Lösungsweg selbstständig anwenden.'],['help','Ich kann ihn mit einer Hilfe anwenden.'],['triangle','Ich muss das rechtwinklige Dreieck noch einmal üben.']].map(([v,l])=>`<label class="choice"><input type="radio" name="self" value="${v}" ${state.self===v?'checked':''}>${l}</label>`).join('')}</fieldset><div id="selfResponse" role="status" aria-live="polite">${selfResponse()}</div></section>`:'');
$('main').innerHTML=`<div class="station-top"><p class="eyebrow">Station ${n+1} von 5</p><span class="time">${times[n]}</span></div><h2 id="stationTitle">${titles[n]}</h2>${body}`;
$('prev').disabled=n===0;$('next').disabled=!complete||n===4;$('next').textContent=n===4?'Abgeschlossen':n===3?'Zum Abschluss →':'Weiter →';
$('navStatus').textContent=n===4?(stationDone(4)?'Alle 5 Stationen abgeschlossen.':state.done.finalTask?'Wähle noch deine Selbsteinschätzung.':'Löse die Abschlussaufgabe.'):(complete?'Station bearbeitet. Du kannst weitergehen.':'Bearbeite die Aufgaben, um weiterzugehen.');
mountScenes();updateRelation();if(focus){$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}save();}
function selfResponse(){if(!state.self)return '';const notes={alone:'Du schätzt dich als selbstständig ein. Prüfe beim nächsten Kegel, ob du den Ansatz auch ohne Hilfen begründen kannst.',help:'Nutze beim nächsten Kegel die Formelkarte und öffne Hilfen schrittweise.',triangle:'Gehe über „Zurück“ noch einmal zu Station 1. Achte auf den Radius und den rechten Winkel am Mittelpunkt.'};return `<div class="complete-banner"><h3>Geschafft · 5 von 5 Stationen</h3><p>${notes[state.self]}</p><p class="small">Übernimm den Merksatz in dein Heft. Deine Eingaben bleiben beim Zurückgehen erhalten.</p></div>`;}
function readInputs(form){new FormData(form).forEach((v,k)=>state.values[k]=v);save();}
function validEquation(raw){const x=String(raw).toLowerCase().replace(/\s/g,'').replace(/²/g,'2').replace(/\^2/g,'2').replace(/[()]/g,'').replace(/([rhs])\*\1/g,'$12');return ['s2=r2+h2','s2=h2+r2','r2+h2=s2','h2+r2=s2'].includes(x);}
function check(id,form){if(state.done[id])return;readInputs(form);const t=tasks[id],errors=[];let rounding=false;const swapped=id==='triangle'&&state.values.triangle_leg1==='h'&&state.values.triangle_leg2==='r';
for(const f of t.fields){const raw=state.values[id+'_'+f.id]??'',a=numeric(raw);let ok=f.type==='number'?near(a,f.answer):(swapped&&['leg1','leg2'].includes(f.id))||raw===f.answer,msg='';
if(f.type==='number'&&!ok&&['O','OA','OB','G','M'].includes(f.id)&&near(a,f.answer,.015000001)){ok=true;rounding=true;}
if(f.type==='number'&&/cm/i.test(raw)){const squared=/cm(?:²|\^2|2)\s*$/i.test(raw),area=!['s','r'].includes(f.id);if(squared!==area){ok=false;msg=area?'Die Zahl gehört zu einer Fläche: Verwende cm².':'Die Mantellinie ist eine Länge: Verwende cm.';}else if(area&&!state.values[id+'_unit']){state.values[id+'_unit']='cm2';const u=form.elements.namedItem(id+'_unit');if(u)u.value='cm2';}}
if(!ok){if(msg){}else if(!String(raw).trim())msg=f.id==='unit'?'Wähle noch eine Einheit. Der Oberflächeninhalt ist eine Fläche und braucht cm².':'Trage eine Antwort ein oder wähle eine Möglichkeit aus.';
else if(f.type==='number'){if(!Number.isFinite(a))msg='Gib hier nur die Zahl ein, mit Komma oder Punkt. Die Einheit steht am Feld oder wird separat gewählt.';
else {const special=(f.wrong||[]).find(([v])=>near(a,v,.03));msg=special?special[1]:(Math.abs(a-f.answer)<=Math.max(.04,Math.abs(f.answer)*.001)?'Dein Rechenweg kann stimmen. Prüfe, ob du zu früh gerundet hast. Rechne mit ungerundeten Zwischenwerten und der π-Taste weiter.':id==='sq'&&near(a,6)?'Du verwendest den Durchmesser. Die Kathete vom Mittelpunkt zum Rand ist der Radius 3 cm.':'Prüfe deine eingesetzten Werte und die Rechenreihenfolge. Nutze bei Bedarf die nächste Hilfe.');}}
else msg=f.error||'Prüfe deine Auswahl mithilfe der Zeichnung.';
errors.push({field:f.id,label:f.label,msg});}
const el=form.elements.namedItem(id+'_'+f.id);if(el&&el.setAttribute)el.setAttribute('aria-invalid',String(!ok));}
if(errors.length){state.attempts[id]=(state.attempts[id]||0)+1;const fb=$('fb_'+id);fb.className='feedback';fb.innerHTML='<strong>Noch einmal genau hinsehen:</strong><ul>'+errors.map(e=>`<li><b>${esc(e.label)}:</b> ${esc(e.msg)}</li>`).join('')+'</ul>'+(state.attempts[id]>=2?'<p>Du hast es mehrfach versucht. Unter der Rückmeldung kannst du eine zusätzliche Hilfe öffnen.</p>':'');$('help_'+id).innerHTML=helpHTML(id,state.hints[id]||0);$('review_'+id).innerHTML=reviewHTML(id);save();}
else{state.done[id]=rounding?'rounding':'correct';save();render();const fb=$('fb_'+id);fb.tabIndex=-1;fb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest',behavior:'auto'});}}
function showModal(type){returnFocus=$(type==='reset'?'resetBtn':'formulaBtn');const modal=$('modal');modal.innerHTML=type==='reset'?'<h2 id="modalTitle">Neu beginnen?</h2><p>Alle Eingaben, geöffneten Hilfen und dein Fortschritt in diesem Lernpfad werden auf diesem Gerät gelöscht.</p><div class="modal-actions"><button data-close>Abbrechen</button><button class="primary" id="confirmReset">Ja, neu beginnen</button></div>':`<h2 id="modalTitle">Deine Formelkarte</h2><p>Für einen geraden Kreiskegel:</p><div class="formula math"><span class="s">s</span> = √(<span class="r">r</span>² + <span class="h">h</span>²)<br>G = πr²<br>M = πrs<br>O = G + M = πr² + πrs</div><div class="legend"><span class="r">r · Radius</span><span class="h">h · Höhe</span><span class="s">s · Mantellinie</span></div><p class="notice">Bei gegebenem Durchmesser: r = d : 2.<br>Zwischenwerte ungerundet weiterverwenden. Endergebnis auf zwei Nachkommastellen runden. Flächeneinheit nicht vergessen.</p><div class="modal-actions"><button data-close class="primary">Zurück zur Aufgabe</button></div>`;$('overlay').hidden=false;document.body.style.overflow='hidden';document.querySelector('.shell').setAttribute('inert','');document.querySelector('header').setAttribute('inert','');modal.querySelector('button').focus();}
function closeModal(){ $('overlay').hidden=true;document.body.style.overflow='';document.querySelector('.shell').removeAttribute('inert');document.querySelector('header').removeAttribute('inert');if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
async function copyMemory(){let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(merksatz);copied=true;}}catch(e){}if(!copied){const ta=document.createElement('textarea');ta.value=merksatz;ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);try{copied=document.execCommand('copy');}catch(e){}ta.remove();$('copyBtn').focus();}if(copied)$('copyStatus').textContent='Merksatz kopiert. Du kannst ihn jetzt einfügen.';else{const range=document.createRange();range.selectNodeContents($('memory'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('copyStatus').textContent='Automatisches Kopieren ist hier nicht verfügbar. Der Text ist markiert: Nutze „Kopieren“ im Auswahlmenü oder schreibe den Merksatz ab.';}}
document.addEventListener('input',e=>{if(e.target.name&&e.target.name!=='self'){state.values[e.target.name]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.name==='self'){state.self=e.target.value;save();const scroll=window.scrollY;render();const choice=document.querySelector(`input[name="self"][value="${state.self}"]`);choice.focus({preventScroll:true});window.scrollTo(0,scroll);}else if(e.target.name){state.values[e.target.name]=e.target.value;save();}});
document.addEventListener('submit',e=>{if(e.target.matches('form[data-task]')){e.preventDefault();check(e.target.dataset.task,e.target);}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-edge]');if(!b)return;if(b.id==='prev'&&state.current>0){state.current--;render(true);}else if(b.id==='next'&&state.current<4&&stationDone(state.current)){state.current++;render(true);}else if(b.dataset.view!==undefined){state.view=Number(b.dataset.view);render();document.querySelector(`[data-view="${state.view}"]`).focus({preventScroll:true});}else if(b.dataset.hint){const id=b.dataset.hint;state.hints[id]=(state.hints[id]||0)+1;$('help_'+id).innerHTML=helpHTML(id,state.hints[id]);const li=$('help_'+id).querySelector('li:last-child');li.tabIndex=-1;li.focus({preventScroll:true});li.scrollIntoView({block:'nearest'});save();}else if(b.id==='formulaBtn')showModal('formula');else if(b.id==='resetBtn')showModal('reset');else if(b.hasAttribute('data-close'))closeModal();else if(b.id==='confirmReset'){state=fresh();closeModal();render(true);}else if(b.id==='extrasBtn'){state.extras=!state.extras;render();$('extrasBtn').focus({preventScroll:true});}else if(b.id==='copyBtn')copyMemory();});
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input,select,[tabindex="0"]')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.matches('[data-edge]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}else if(e.key==='Enter'&&e.target.matches('input:not([type="radio"]),select')){const form=e.target.closest('form[data-task]');if(form){e.preventDefault();check(form.dataset.task,form);}}});
// Orthographic projection of an actual three-dimensional cone, without dependencies.
const cameraDefault=()=>({yaw:30,pitch:18,mode:'solid',focus:''});
const scenes={intro:[{r:3,h:5,title:'Gerader Kreiskegel'}],basic:[{r:3,h:4,title:'Kegel aus Aufgabe A'}],compare:[{r:3,h:8,title:'Kegel A'},{r:4,h:5,title:'Kegel B'}]};
function camera(id){state.cameras=state.cameras||{};return state.cameras[id]||(state.cameras[id]=cameraDefault());}
function explorer(id){const c=camera(id);return `<section class="explorer" data-scene="${id}" aria-label="Interaktives Kegelmodell"><div class="scene-modes" role="group" aria-label="Ansicht wählen">${[['solid','Kegel drehen'],['cut','Axialschnitt im Kegel'],['flat','Dreieck frontal']].map(([v,l])=>`<button type="button" data-scene-mode="${v}" aria-pressed="${c.mode===v}">${l}</button>`).join('')}</div><div class="scene-drawings ${scenes[id].length>1?'pair':''}" id="scene_${id}"></div><div class="scene-controls"><button type="button" data-turn="-20" aria-label="Kegel um 20 Grad nach links drehen">↶ Links</button><button type="button" data-turn="20" aria-label="Kegel um 20 Grad nach rechts drehen">Rechts ↷</button><button type="button" data-home>Ansicht zurücksetzen</button><label>Neigung <input type="range" min="-20" max="55" step="1" value="${c.pitch}" data-pitch aria-label="Blickwinkel neigen"></label></div><p class="small muted scene-instruction" id="scene_note_${id}"></p><div class="scene-modes" role="group" aria-label="Strecken untersuchen">${[['r','r · Radius'],['h','h · Höhe'],['s','s · Mantellinie']].map(([v,l])=>`<button type="button" data-inspect="${v}" aria-pressed="${c.focus===v}" class="${v}">${l}</button>`).join('')}</div><p class="scene-description" id="scene_desc_${id}" role="status" aria-live="polite"></p></section>`;}
function projectPoint(p,c,scale){const a=c.yaw*Math.PI/180,b=c.pitch*Math.PI/180,x=Math.cos(a)*p[0]-Math.sin(a)*p[2],z=Math.sin(a)*p[0]+Math.cos(a)*p[2];return [270+scale*x,205+scale*(-Math.cos(b)*p[1]+Math.sin(b)*z),Math.sin(b)*p[1]+Math.cos(b)*z];}
function hull(points){const p=points.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]),cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);let lo=[],up=[];for(const x of p){while(lo.length>1&&cross(lo[lo.length-2],lo[lo.length-1],x)<=0)lo.pop();lo.push(x);}for(const x of p.slice().reverse()){while(up.length>1&&cross(up[up.length-2],up[up.length-1],x)<=0)up.pop();up.push(x);}return lo.slice(0,-1).concat(up.slice(0,-1));}
const xy=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
function drawCone(config,c,id,index){const R=config.r,H=config.h,scale=id==='compare'?28:Math.min(58,300/Math.max(H,2*R)),flat=c.mode==='flat';let A,Z,B,C,shape='',ring='';
const point=p=>projectPoint([p[0],p[1]-H/2,p[2]],c,scale);
if(flat){Z=[180,330];A=[180,330-H*scale];B=[180+R*scale,330];C=[180-R*scale,330];shape=`<path d="M${xy(A)} L${xy(Z)} L${xy(B)} Z" fill="#e0ebfa"/>`;}
else {A=point([0,H,0]);Z=point([0,0,0]);B=point([R,0,0]);C=point([-R,0,0]);const n=72,pts=Array.from({length:n},(_,i)=>point([R*Math.cos(i*2*Math.PI/n),0,R*Math.sin(i*2*Math.PI/n)]));let faces=[];
for(let i=0;i<n;i++){const u=pts[i],v=pts[(i+1)%n],shade=Math.round(225+13*Math.cos(i*2*Math.PI/n+c.yaw*Math.PI/180));faces.push({z:(u[2]+v[2]+A[2])/3,svg:`<path d="M${xy(A)} L${xy(u)} L${xy(v)} Z" fill="rgb(${shade-12},${shade-3},${Math.min(shade+10,255)})" stroke="none"/>`});}
faces.push({z:Z[2],svg:`<polygon points="${pts.map(xy).join(' ')}" fill="#d3ddeb"/>`});faces.sort((a,b)=>a.z-b.z);shape=`<g opacity="${c.mode==='cut'?'.35':'.8'}">${faces.map(f=>f.svg).join('')}</g><polygon points="${hull(pts.concat([A])).map(xy).join(' ')}" fill="none" stroke="#7387a3" stroke-width="1.7"/>`;
if(c.mode==='cut')shape+=`<path d="M${xy(A)} L${xy(C)} L${xy(B)} Z" fill="#8eaee840" stroke="#687d9b" stroke-dasharray="5 5"/><path d="M${xy(A)} L${xy(Z)} L${xy(B)} Z" fill="#6497e72e"/>`;
for(let i=0;i<n;i++){const theta=(i+.5)*2*Math.PI/n,front=c.pitch<0||Math.sin(theta+c.yaw*Math.PI/180)*Math.cos(c.pitch*Math.PI/180)+R/H*Math.sin(c.pitch*Math.PI/180)>0;ring+=`<path d="M${xy(pts[i])} L${xy(pts[(i+1)%n])}" fill="none" stroke="#7387a3" stroke-width="1.5" ${front?'':'stroke-dasharray="3 4"'}/>`;}}
const visibleS=flat||c.mode==='cut'||Math.sin(c.yaw*Math.PI/180)*Math.cos(c.pitch*Math.PI/180)+R/H*Math.sin(c.pitch*Math.PI/180)>0;
const edgeSVG=(name,p,q,color,dash)=>`<g><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="${c.focus===name?7:3}" ${dash?`stroke-dasharray="${dash}"`:''}/><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="transparent" stroke-width="30" data-scene-edge="${name}"/></g>`;
const q=Math.min(R,H)*.12,mark=flat?[[Z[0],Z[1]-q*scale],[Z[0]+q*scale,Z[1]-q*scale],[Z[0]+q*scale,Z[1]]]:[[0,q,0],[q,q,0],[q,0,0]].map(point);
const label=(name,p,q,dx,dy,color)=>`<text x="${(p[0]+q[0])/2+dx}" y="${(p[1]+q[1])/2+dy}" fill="${color}" class="edge-label">${name}</text>`;
return `<figure class="cone-figure"><figcaption><b>${config.title}</b>${id==='compare'?` · r = ${R} cm, h = ${H} cm`:''}</figcaption><svg class="rotating-cone" viewBox="80 0 380 410" tabindex="0" role="group" aria-label="${config.title}: ${flat?'unverzerrter halber Axialschnitt':'drehbares räumliches Modell'}. A ist die Spitze, Z der Mittelpunkt, B der Randpunkt. AZ ist h, ZB ist r, AB ist s. Winkel AZB ist 90 Grad. Pfeiltasten drehen und neigen, Pos1 setzt die Ansicht zurück." data-cone-index="${index}">${shape}${ring}${edgeSVG('h',A,Z,'#087147',flat||c.mode==='cut'?'':'7 5')}${edgeSVG('r',Z,B,'#a22262',flat||c.mode==='cut'||c.pitch<0?'':'3 4')}${edgeSVG('s',A,B,'#174fb5',visibleS?'':'7 5')}<polyline points="${mark.map(xy).join(' ')}" fill="none" stroke="#263950" stroke-width="2"/><circle cx="${Z[0]}" cy="${Z[1]}" r="3" fill="#263950"/>${label('h',A,Z,-24,0,'#087147')}${label('r',Z,B,0,27,'#a22262')}${label('s',A,B,17,-4,'#174fb5')}<text x="${A[0]-6}" y="${A[1]-15}">A</text><text x="${Z[0]-23}" y="${Z[1]+20}">Z</text><text x="${B[0]+12}" y="${B[1]+7}">B</text></svg></figure>`;}
function refreshScene(id){const root=document.querySelector(`[data-scene="${id}"]`);if(!root)return;const c=camera(id);root.querySelector('.scene-drawings').innerHTML=scenes[id].map((x,i)=>drawCone(x,c,id,i)).join('');root.querySelectorAll('[data-scene-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sceneMode===c.mode)));root.querySelectorAll('[data-inspect]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.inspect===c.focus)));root.querySelectorAll('[data-turn],[data-pitch]').forEach(e=>e.disabled=c.mode==='flat');root.querySelector('[data-pitch]').value=c.pitch;
$('scene_note_'+id).textContent=c.mode==='flat'?'Unverzerrte Schnittansicht: Der rechte Winkel bei Z ist direkt erkennbar. Die Seitenlängen sind dieselben wie im räumlichen Modell.':'Waagerecht ziehen oder die Drehtasten nutzen. Mit den Pfeiltasten lässt sich die Ansicht ebenfalls bewegen. In der räumlichen Projektion kann der rechte Winkel schief aussehen; im Kegel bleibt er 90°. Gestrichelt: verdeckte Strecken.';
if(c.mode==='cut')$('scene_note_'+id).textContent='Die Körperhülle ist durchscheinend; der Axialschnitt ist hervorgehoben. '+$('scene_note_'+id).textContent;
const notes={r:'r verbindet den Mittelpunkt Z mit dem Rand B. Die ganze Breite des Axialschnitts ist 2r.',h:'h führt von der Spitze A senkrecht zur Grundfläche zum Mittelpunkt Z. Drehen verändert diese Höhe nicht.',s:'s verbindet die Spitze A mit dem Rand B. Im Dreieck AZB liegt sie dem rechten Winkel gegenüber.'};const desc=notes[c.focus]||'Untersuche eine Strecke durch Antippen oder mit den beschrifteten Tasten. Das Drehen ist freiwillig.';if($('scene_desc_'+id).textContent!==desc)$('scene_desc_'+id).textContent=desc;if(c.mode!=='flat'&&Math.abs(Math.cos(c.yaw*Math.PI/180))<.12)$('scene_note_'+id).textContent='Du blickst fast auf die Kante des Schnitts. Die Strecken überlagern sich im Bild. Wähle „Dreieck frontal“, um den rechten Winkel und die Seiten klar zu sehen.';}
function mountScenes(){document.querySelectorAll('[data-scene]').forEach(root=>refreshScene(root.dataset.scene));}
function updateCamera(id,change){Object.assign(camera(id),change);refreshScene(id);save();}
let sceneDrag=null;
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('.rotating-cone');if(!svg)return;const id=svg.closest('[data-scene]').dataset.scene;if(camera(id).mode==='flat')return;sceneDrag={id,node:svg,x:e.clientX,y:e.clientY,yaw:camera(id).yaw,pitch:camera(id).pitch,pointer:e.pointerId,touch:e.pointerType==='touch',moved:false};svg.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!sceneDrag||sceneDrag.pointer!==e.pointerId)return;const d=sceneDrag,dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.moved&&Math.abs(dx)<5&&Math.abs(dy)<5)return;if(d.touch&&!d.moved&&Math.abs(dy)>Math.abs(dx)){sceneDrag=null;return;}d.moved=true;const c=camera(d.id);c.yaw=((d.yaw+dx*.5+540)%360)-180;if(!d.touch)c.pitch=Math.max(-20,Math.min(55,d.pitch-dy*.3));
// Keep the captured SVG node in place while replacing only its drawing.
const config=scenes[d.id][Number(d.node.dataset.coneIndex)],temp=document.createElement('div');temp.innerHTML=drawCone(config,c,d.id,Number(d.node.dataset.coneIndex));d.node.innerHTML=temp.querySelector('svg').innerHTML;
const all=d.node.closest('[data-scene]');all.querySelector('[data-pitch]').value=c.pitch;all.querySelectorAll('.rotating-cone').forEach(svg=>{if(svg!==d.node){temp.innerHTML=drawCone(scenes[d.id][Number(svg.dataset.coneIndex)],c,d.id,Number(svg.dataset.coneIndex));svg.innerHTML=temp.querySelector('svg').innerHTML;}});});
document.addEventListener('pointerup',e=>{if(sceneDrag&&sceneDrag.pointer===e.pointerId){const d=sceneDrag;sceneDrag=null;if(d.moved){window.sceneSuppressClick=true;setTimeout(()=>window.sceneSuppressClick=false,0);refreshScene(d.id);save();}}});
document.addEventListener('pointercancel',()=>{if(sceneDrag){const id=sceneDrag.id;sceneDrag=null;refreshScene(id);save();}});
document.addEventListener('click',e=>{const root=e.target.closest('[data-scene]');if(!root||window.sceneSuppressClick)return;const id=root.dataset.scene,c=camera(id),mode=e.target.closest('[data-scene-mode]'),turn=e.target.closest('[data-turn]'),home=e.target.closest('[data-home]'),inspect=e.target.closest('[data-inspect],[data-scene-edge]');if(mode)updateCamera(id,{mode:mode.dataset.sceneMode});else if(turn)updateCamera(id,{yaw:((c.yaw+Number(turn.dataset.turn)+540)%360)-180});else if(home)updateCamera(id,cameraDefault());else if(inspect)updateCamera(id,{focus:inspect.dataset.inspect||inspect.dataset.sceneEdge});});
document.addEventListener('input',e=>{if(e.target.matches('[data-pitch]'))updateCamera(e.target.closest('[data-scene]').dataset.scene,{pitch:Number(e.target.value)});});
document.addEventListener('keydown',e=>{if(!e.target.matches('.rotating-cone'))return;const id=e.target.closest('[data-scene]').dataset.scene,c=camera(id);if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home')updateCamera(id,cameraDefault());else if(c.mode!=='flat'){if(e.key==='ArrowLeft'||e.key==='ArrowRight')c.yaw=((c.yaw+(e.key==='ArrowLeft'?-10:10)+540)%360)-180;else c.pitch=Math.max(-20,Math.min(55,c.pitch+(e.key==='ArrowUp'?5:-5)));refreshScene(id);save();}rootFocus(id);});
function rootFocus(id){document.querySelector(`[data-scene="${id}"] .rotating-cone`).focus({preventScroll:true});}

function updateRelation(){const el=$('relationPreview');if(!el)return;const left={1:'h',2:'r',3:'s'}[state.values.triangle_hyp]||'□';el.textContent=left+'² = '+(state.values.triangle_leg1||'□')+'² + '+(state.values.triangle_leg2||'□')+'²';}
document.addEventListener('change',e=>{if(e.target.name&&e.target.name.startsWith('triangle_'))updateRelation();});
document.addEventListener('click',e=>{const open=e.target.closest('[data-review-open]'),done=e.target.closest('[data-review-done]');if(open){const id=open.dataset.reviewOpen;state.review[id]=true;$('review_'+id).innerHTML=reviewHTML(id);$('reviewConfirm_'+id).focus();save();}if(done){const id=done.dataset.reviewDone;if(!$('reviewConfirm_'+id).checked){$('reviewFeedback_'+id).textContent='Vergleiche zuerst den Lösungsweg und bestätige danach, dass du die Korrektur nachvollzogen hast.';return;}state.done[id]='supported';save();render();const fb=$('fb_'+id);fb.tabIndex=-1;fb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest'});}});

render();
</script></body></html>
