<script>
'use strict';
const KEY='kegel-lernweg-v1';
const titles=['Problem & Lernziel','Dreieck entdecken','Mantellinie berechnen','Oberfläche berechnen','Fehlerdetektiv','Selbstständig üben','Abschluss & Merksatz'];
const times=['1 Minute','4 Minuten','3 Minuten','3 Minuten','4 Minuten','5 Minuten','3 Minuten'];
const fresh=()=>({v:1,current:0,done:{},values:{},attempts:{},hints:{},view:0,self:'',extras:false});
let state=fresh(),persist=true,returnFocus=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.done&&s.values&&s.hints&&s.attempts&&Number.isInteger(s.current)&&s.current>=0&&s.current<7)state=Object.assign(fresh(),s);}catch(e){persist=false;}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const numeric=x=>{const t=String(x).trim().replace(/\s/g,'').replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t)?Number(t):NaN};
const near=(a,b,t=.005000001)=>Number.isFinite(a)&&Math.abs(a-b)<=t;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persist=true;}catch(e){persist=false;}$('storageNote').textContent=persist?'Offline · Fortschritt nur in diesem Browser gespeichert · Keine Übertragung':'Offline · Fortschritt bleibt während dieser Sitzung erhalten; dauerhaftes Speichern ist hier nicht verfügbar.';}
const unit=(id='unit',label='Einheit des Oberflächeninhalts')=>({id,label,type:'select',options:[['cm','cm'],['cm2','cm²'],['cm3','cm³']],answer:'cm2',error:'Der Oberflächeninhalt ist eine Fläche und benötigt deshalb eine Quadrateinheit: cm².'});
const num=(id,label,answer,extra={})=>({id,label,type:'number',answer,...extra});
const sel=(id,label,options,answer,error)=>({id,label,type:'select',options,answer,error});
const tasks={};
function add(t){tasks[t.id]=t;return t.id;}
function cone(mode=2,unknown=false,interactive=false){return `<figure class="diagram"><svg viewBox="0 0 420 350" role="${interactive?'group':'img'}" aria-label="Gerader Kreiskegel mit Spitze A, Grundflächenmittelpunkt Z und Randpunkt B. AZ ist senkrecht zu ZB. AZ ist die Höhe, ZB der Radius, AB die Mantellinie."><path d="M70 282 L210 40 L350 282" fill="#edf2f9" stroke="#6d8098" stroke-width="2"/><path d="M70 282 C70 234 350 234 350 282" fill="none" stroke="#8697ab" stroke-width="2" stroke-dasharray="6 5"/><path d="M70 282 C70 330 350 330 350 282" fill="none" stroke="#6d8098" stroke-width="2"/>${mode>=1?'<path d="M70 282 L210 40 L350 282 Z" fill="#9cb8e52b" stroke="#7b8da5" stroke-dasharray="6 5"/>':''}${mode>=2?'<path d="M210 40 L210 282 L350 282 Z" fill="#bfd4f47a"/>':''}
${edge('1',210,40,210,282,'#087147','7 5',interactive)}${edge('2',210,282,350,282,'#a22262','4 4',interactive)}${edge('3',210,40,350,282,'#174fb5','',interactive)}<path d="M210 263 L229 263 L229 282" fill="none" stroke="#253b53" stroke-width="2"/><circle cx="218" cy="274" r="2" fill="#253b53"/><circle cx="210" cy="282" r="3.5" fill="#253b53"/><text x="205" y="26">A</text><text x="190" y="306">Z</text><text x="358" y="290">B</text><text x="165" y="174" class="h">${unknown?'①':'h'}</text><text x="275" y="308" class="r">${unknown?'②':'r'}</text><text x="295" y="160" class="s">${unknown?'③':'s'}</text>${mode>=1?'<text x="115" y="308" style="font-size:16px">r</text>':''}</svg><figcaption>${mode===0?'Gerader Kreiskegel · Darstellung nicht maßstabsgetreu':mode===1?'Axialschnitt: Die ganze Breite ist 2r.':'Halber Axialschnitt: Die Kathete ZB ist nur r.'} Verdeckte Strecken sind gestrichelt.</figcaption></figure>`;}
function edge(id,x1,y1,x2,y2,color,dash,inter){return `<g ${inter?`class="svg-edge" role="button" tabindex="0" data-edge="${id}" aria-label="Strecke ${id} als Hypotenuse wählen"`:''}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:''}/>${inter?`<line class="svg-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`:''}</g>`;}
function generalHints(r,h){const s=Math.hypot(r,h),G=Math.PI*r*r,M=Math.PI*r*s;return [cone(2)+'Das Dreieck besteht aus Radius r, Höhe h und Mantellinie s.','Es fehlt die schräge Mantellinie s. Sie ist die Hypotenuse.','Für die Mantellinie gilt s = √(r² + h²).',`Setze ein: s = √(${r}² + ${h}²) = √(${r*r+h*h}). Nutze das Ergebnis im Taschenrechner weiter.`,`Musterhilfe: s = √(${r*r+h*h}) ≈ ${fmt(s)} cm; G = π · ${r}² ≈ ${fmt(G)} cm²; M = π · ${r} · √(${r*r+h*h}) ≈ ${fmt(M)} cm²; O = G + M ≈ ${fmt(G+M)} cm². Gerechnet wird mit ungerundeten Werten.`];}
function calcFields(r,h,full=true){const s=Math.hypot(r,h),G=Math.PI*r*r,M=Math.PI*r*s;return [...(full?[num('s','Mantellinie s in cm',s,{wrong:[[r*r+h*h,'Du hast s² berechnet. Gesucht ist die Länge s. Ziehe noch die Quadratwurzel.'],[Math.hypot(2*r,h),'Du hast den Durchmesser verwendet. Die Kathete reicht vom Mittelpunkt zum Rand: Verwende r.']]}),num('G','Grundfläche G in cm²',G),num('M','Mantelfläche M in cm²',M,{wrong:[[Math.PI*r*h,'Für die Mantelfläche brauchst du die schräge Strecke s. Die Höhe h liegt im Inneren des Kegels.']]})]:[]),num('O','Oberflächeninhalt O',G+M,{wrong:[[G+Math.PI*r*h,'Für die Mantelfläche brauchst du s statt h. Berechne zuerst s = √(r² + h²).'],[M,'Das ist nur die Mantelfläche. Addiere noch die Grundfläche πr².']]}),unit()];}
add({id:'intro',title:'Welche Idee führt zur fehlenden Länge?',fields:[{id:'idea',type:'radio',label:'Wähle den passenden Ansatz.',options:[['sum','Radius und Höhe addieren.'],['pyth','Pythagoras im rechtwinkligen Dreieck nutzen.'],['height','Die Höhe direkt als Mantellinie verwenden.']],answer:'pyth',error:'r und h stehen senkrecht aufeinander. Die schräge Länge s erhältst du mit dem Satz des Pythagoras.'}],solution:'r und h sind die Katheten, s ist die Hypotenuse: s² = r² + h². Deshalb ist s = √(r² + h²).',hints:['Die Höhe steht senkrecht auf der Grundfläche.','Im halben Axialschnitt entsteht ein rechtwinkliges Dreieck.']});
add({id:'triangle',title:'Ordne die Strecken zu.',body:'Die Ziffern in der Zeichnung gehören zu den Strecken. Für die Hypotenuse kannst du auch eine Strecke in der Zeichnung antippen.',fields:[sel('edge1','① Von A nach Z',[['r','Radius r'],['h','Höhe h'],['s','Mantellinie s']],'h','AZ verläuft senkrecht von der Spitze zum Mittelpunkt: Das ist h.'),sel('edge2','② Von Z nach B',[['d','Durchmesser 2r'],['r','Radius r'],['s','Mantellinie s']],'r','Die waagerechte Seite reicht vom Mittelpunkt bis zum Rand. Sie ist deshalb der Radius r, nicht 2r.'),sel('edge3','③ Von A nach B',[['h','Höhe h'],['s','Mantellinie s'],['r','Radius r']],'s','Die schräge Strecke von der Spitze zum Rand ist die Mantellinie s.'),sel('hyp','Hypotenuse',[['1','① AZ'],['2','② ZB'],['3','③ AB']],'3','Die Hypotenuse liegt dem rechten Winkel gegenüber: die schräge Strecke AB.'),sel('angle','Wo liegt der rechte Winkel?',[['A','An der Spitze A'],['Z','Am Mittelpunkt Z'],['B','Am Randpunkt B']],'Z','h und r treffen sich am Grundflächenmittelpunkt Z im rechten Winkel.'),sel('eq','Vervollständige: s² = …',[['minus','h² − r²'],['diam','(2r)² + h²'],['sum','r² + h²']],'sum','s ist die Hypotenuse. Ihr Quadrat ist die Summe der Kathetenquadrate r² + h².')],solution:'① AZ = h und ② ZB = r sind die Katheten. ③ AB = s liegt dem rechten Winkel bei Z gegenüber. Deshalb: s² = r² + h².',hints:['Suche den kleinen Winkelmarker am Punkt Z.','Die ganze Breite des Kegels beträgt 2r, die halbe Breite ZB nur r.','Die Hypotenuse berührt den rechten Winkel nicht.']});
add({id:'sq',title:'1 · Die Katheten einsetzen',body:'Gegeben: r = 3 cm und h = 4 cm. Ergänze s² = □² + □². Die Reihenfolge der beiden Katheten ist beliebig.',fields:[num('a','Erste Kathete in cm',3),num('b','Zweite Kathete in cm',4)],solution:'s² = 3² + 4². Du addierst die Quadrate der beiden Katheten.',hints:['Setze Radius und Höhe ein. Nicht den Durchmesser.']});
add({id:'sum',title:'2 · Die Quadrate addieren',body:'s² = 3² + 4²',fields:[num('v','s² in cm²',25,{wrong:[[7,'Quadriere zuerst: 3² = 9 und 4² = 16. Erst danach addieren.'],[5,'5 cm ist schon die Länge s. Hier ist noch s² gefragt.']]})],solution:'s² = 9 + 16 = 25 cm².',hints:['3² bedeutet 3 · 3, 4² bedeutet 4 · 4.']});
add({id:'root',title:'3 · Die Länge bestimmen',body:'s² = 25 cm². Gesucht ist die Mantellinie.',fields:[num('s','s in cm',5,{wrong:[[25,'Du hast s² berechnet. Gesucht ist die Länge s. Ziehe noch die Quadratwurzel.']]})],solution:'s = √25 = 5,00 cm. Eine Länge ist positiv.',hints:['Welche positive Zahl ergibt mit sich selbst multipliziert 25?']});
add({id:'irr',title:'4 · Wenn die Wurzel nicht aufgeht',body:'Jetzt: r = 2 cm und h = 3 cm. Berechne s. Gib zwei Nachkommastellen oder einen genaueren Wert an.',fields:[num('s','s in cm',Math.sqrt(13),{wrong:[[13,'13 ist s². Ziehe noch die Quadratwurzel.'],[Math.sqrt(25),'Verwende r = 2 cm statt des Durchmessers 4 cm.']]})],solution:'s = √(2² + 3²) = √13 ≈ 3,61 cm. Im Taschenrechner mit √13 bzw. dem gespeicherten Ergebnis weiterrechnen, nicht mit 3,61.',hints:['s² = 4 + 9.','Ziehe die Wurzel aus 13. Bewahre für weitere Rechnungen den ungerundeten Wert auf.']});
add({id:'surface',title:'Grundfläche + Mantelfläche',body:'Zurück zum ersten Kegel: r = 3 cm, h = 4 cm. Deine berechnete Mantellinie ist s = 5,00 cm. Berechne zuerst die beiden Flächen und addiere ihre ungerundeten Werte.',fields:[num('factor','Welche Länge setzt du für s in M = π · 3 · s ein? (cm)',5,{wrong:[[4,'Für die Mantelfläche brauchst du die schräge Strecke s. Die Höhe h liegt im Inneren des Kegels.']]}),num('G','G = π · 3² in cm²',9*Math.PI),num('M','M = π · 3 · s in cm²',15*Math.PI,{wrong:[[12*Math.PI,'Du hast h = 4 eingesetzt. Für die Mantelfläche brauchst du s = 5.']]}),num('O','O = G + M',24*Math.PI),unit()],solution:`G = 9π ≈ ${fmt(9*Math.PI)} cm²; M = 15π ≈ ${fmt(15*Math.PI)} cm²; O = 24π ≈ ${fmt(24*Math.PI)} cm². Direkt geht es ebenfalls: O = π · 3² + π · 3 · 5.`,hints:['Die Grundfläche ist ein Kreis: G = πr².','Die Mantelformel lautet M = πrs. Setze s = 5 ein.','Addiere 9π und 15π. Runde möglichst erst die Gesamtsumme.']});
const detectors=[
{id:'errH',title:'1 · Die falsche Strecke',body:'Ein Kegel hat r = 3 cm, h = 4 cm und s = 5 cm. Lea rechnet: M = π · 3 · 4.',options:[['h','h wird statt s eingesetzt.'],['g','Die Grundfläche wird doppelt gerechnet.'],['pi','π darf hier nicht verwendet werden.']],answer:'h',reasons:[['inside','h liegt im Inneren; für M braucht man die schräge Strecke s.'],['longest','Für M wird immer die kürzeste Strecke benötigt.'],['sum','M ist die Summe von r und h.']],reason:'inside',solution:'Die Mantelfläche braucht die Mantellinie: M = πrs = π · 3 · 5 ≈ 47,12 cm².'},
{id:'errD',title:'2 · Ein zu großes Dreieck',body:'r = 3 cm und h = 4 cm. Amir schreibt: s = √(6² + 4²).',options:[['d','Der Durchmesser wird als Kathete verwendet.'],['root','Die Wurzel ist hier unnötig.'],['height','Die Höhe müsste verdoppelt werden.']],answer:'d',reasons:[['half','Im halben Axialschnitt reicht die Kathete vom Mittelpunkt zum Rand: r.'],['whole','Das rechtwinklige Dreieck umfasst immer die ganze Grundflächenbreite.'],['minus','Kathetenquadrate muss man voneinander abziehen.']],reason:'half',solution:'Verwende r = 3 cm: s = √(3² + 4²) = √25 = 5,00 cm.'},
{id:'errRoot',title:'3 · Quadrat oder Länge?',body:'r = 5 cm und h = 12 cm. Ben schreibt: s² = 25 + 144 = 169; also s = 169 cm.',options:[['add','Die Addition ist falsch.'],['root','Die Quadratwurzel fehlt.'],['unit','s muss in cm³ angegeben werden.']],answer:'root',reasons:[['square','169 ist s²; für die Länge s muss man die Wurzel ziehen.'],['divide','Um s zu erhalten, teilt man s² durch 2.'],['pi','Bei jeder Kegellänge muss mit π multipliziert werden.']],reason:'square',solution:'s² = 169 cm². Daraus folgt s = √169 = 13,00 cm.'},
{id:'errUnit',title:'4 · Die Einheit zählt',body:'Nora berechnet für r = 3 cm und h = 4 cm richtig O = 24π, schreibt aber: O ≈ 75,40 cm.',options:[['unit','Die Flächeneinheit fehlt.'],['sum','Grund- und Mantelfläche dürfen nicht addiert werden.'],['s','Die Mantellinie ist zu kurz.']],answer:'unit',reasons:[['area','O beschreibt eine Fläche und benötigt eine Quadrateinheit.'],['length','O beschreibt eine Strecke und benötigt eine Längeneinheit.'],['volume','O beschreibt einen Rauminhalt und benötigt eine Kubikeinheit.']],reason:'area',solution:'O = π · 3² + π · 3 · 5 = 24π ≈ 75,40 cm². Die Einheit lautet cm².'},
{id:'errRound',title:'5 · Zu früh gerundet',body:`r = 2 cm, h = 3 cm. Mia rundet s = √13 zuerst auf 3,6 cm. Sie erhält O ≈ ${fmt(Math.PI*4+Math.PI*2*3.6)} cm². Mit √13 erhält man ${fmt(Math.PI*4+Math.PI*2*Math.sqrt(13))} cm².`,options:[['early','s wurde vor der Weiterrechnung zu stark gerundet.'],['root','√13 wurde als s² statt als s benutzt.'],['pi','π darf nie im Taschenrechner verwendet werden.']],answer:'early',reasons:[['keep','Mit dem ungerundeten Zwischenwert weiterrechnen und erst O runden.'],['more','Jeden Zwischenwert auf ganze Zahlen runden.'],['same','Beide Ergebnisse müssen trotz gerundeter Werte exakt gleich sein.']],reason:'keep',solution:`s = √13. G = 4π; M = 2π√13. Deshalb O = 4π + 2π√13 ≈ ${fmt(Math.PI*4+Math.PI*2*Math.sqrt(13))} cm². Nutze die π-Taste und den gespeicherten Zwischenwert.`}
];
detectors.forEach(d=>add({id:d.id,title:d.title,body:d.body,fields:[sel('error','Welcher Fehler liegt vor?',d.options,d.answer,'Prüfe die verwendeten Strecken, den Rechenschritt oder die Einheit noch einmal.'),sel('why','Welche Begründung passt?',d.reasons,d.reason,'Die Begründung muss erklären, warum genau dieser Rechenschritt falsch ist.')],solution:d.solution,hints:[d.id==='errH'?'Welche Strecke steht in M = πrs?':d.id==='errD'?'Betrachte nur die Hälfte des Axialschnitts.':d.id==='errRoot'?'169 ist eine quadrierte Länge.':d.id==='errUnit'?'Die Oberfläche setzt sich aus zwei Flächen zusammen.':'Vergleiche √13 mit dem gerundeten Wert 3,6.']}));
add({id:'practice1',title:'A · Mit kurzem Rechengerüst',body:'Ein gerader Kreiskegel hat r = 5 cm und h = 12 cm. Berechne s, G, M und den gesamten Oberflächeninhalt O einschließlich Grundfläche.',fields:calcFields(5,12),solution:'s = √(5² + 12²) = 13,00 cm; G = 25π ≈ 78,54 cm²; M = 65π ≈ 204,20 cm²; O = 90π ≈ 282,74 cm².',hints:generalHints(5,12)});
add({id:'practice2',title:'B · Jetzt ohne Rechengerüst',body:'Ein gerader Kreiskegel hat r = 4 cm und h = 7 cm. Berechne den gesamten Oberflächeninhalt einschließlich Grundfläche. Notiere deinen Lösungsweg im Heft. Hier trägst du nur das Endergebnis und die Einheit ein.',fields:calcFields(4,7,false),solution:`s = √(4² + 7²) = √65 ≈ ${fmt(Math.sqrt(65))} cm; G = 16π ≈ ${fmt(16*Math.PI)} cm²; M = 4π√65 ≈ ${fmt(4*Math.PI*Math.sqrt(65))} cm²; O = 16π + 4π√65 ≈ ${fmt(16*Math.PI+4*Math.PI*Math.sqrt(65))} cm².`,hints:generalHints(4,7)});
add({id:'extra1',title:'Extra 1 · Durchmesser & Zusatzangabe',body:'Eine geschlossene kegelförmige Dose hat einen Durchmesser von 10 cm und eine senkrechte Höhe von 12 cm. Sie wiegt 80 g. Wie groß ist ihre gesamte Außenfläche einschließlich Boden? Die Wanddicke wird vernachlässigt.',fields:[num('r','Radius in cm',5,{wrong:[[10,'10 cm ist der Durchmesser. Der Radius ist halb so groß.']]}),...calcFields(5,12,false),sel('unused','Welche Angabe wird nicht benötigt?',[['mass','Die Masse von 80 g.'],['height','Die Höhe von 12 cm.'],['diam','Der Durchmesser von 10 cm.']],'mass','Für die Oberfläche brauchst du die Abmessungen, nicht die Masse.')],solution:'r = d : 2 = 5,00 cm; s = √(5² + 12²) = 13,00 cm. O = π · 5² + π · 5 · 13 = 90π ≈ 282,74 cm². Die Angabe 80 g ist überflüssig.',hints:['Halbiere zuerst den Durchmesser.',...generalHints(5,12)]});
add({id:'extra2',title:'Extra 2 · Rundungsstrategien beurteilen',body:`Für r = 4 cm und h = 7 cm rechnet Tom mit s = 8,06 cm weiter und erhält O ≈ ${fmt(Math.PI*16+Math.PI*4*8.06)} cm². Sara setzt direkt √65 ein und erhält O ≈ ${fmt(Math.PI*16+Math.PI*4*Math.sqrt(65))} cm².`,fields:[sel('who','Welcher Weg ist genauer?',[['tom','Toms Weg'],['sara','Saras Weg'],['same','Beide Wege sind exakt gleich.']],'sara','√65 erhält die volle Genauigkeit der Mantellinie bis zum Endergebnis.'),sel('why','Warum?',[['unrounded','Sara verwendet die ungerundete Mantellinie.'],['smaller','Ein größeres Ergebnis ist immer genauer.'],['pi','Tom hat π vergessen.']],'unrounded','Entscheidend ist, ob der Zwischenwert gerundet wurde.')],solution:`Beide verwenden die richtige Formel. Toms frühe Rundung verändert aber die Hundertstelstelle. Mit s = √65 ergibt sich O ≈ ${fmt(Math.PI*16+Math.PI*4*Math.sqrt(65))} cm².`,hints:['Prüfe, welcher Wert bei der Mantellinie mehr Genauigkeit bewahrt.']});
add({id:'finalTask',title:'Eine Verpackung rundum bekleben',body:'Eine geschlossene Verpackung hat die Form eines geraden Kreiskegels. Ihr Radius beträgt 6 cm, ihre senkrechte Höhe 8 cm. Die gesamte Außenfläche einschließlich des kreisförmigen Bodens soll beklebt werden. Wie viel Folie wird mindestens benötigt? Überlappungen und Verschnitt werden nicht berücksichtigt. Notiere den Rechenweg im Heft.',fields:[num('s','Berechnete Mantellinie s in cm',10,{wrong:[[100,'100 ist s². Ziehe die Wurzel, um die Länge s zu erhalten.'],[Math.hypot(12,8),'Verwende den Radius 6 cm, nicht den Durchmesser 12 cm.']]}),...calcFields(6,8,false)],solution:`s = √(6² + 8²) = √100 = 10,00 cm. G = 36π ≈ ${fmt(36*Math.PI)} cm²; M = 60π ≈ ${fmt(60*Math.PI)} cm². Insgesamt werden O = 96π ≈ ${fmt(96*Math.PI)} cm² Folie benötigt.`,hints:generalHints(6,8)});
const groups=[['intro'],['triangle'],['sq','sum','root','irr'],['surface'],detectors.map(d=>d.id),['practice1','practice2'],['finalTask']];
const stationDone=i=>groups[i].every(id=>state.done[id])&&(i!==6||!!state.self);
function allowedStation(){let n=0;while(n<6&&stationDone(n))n++;return n;}
state.current=Math.min(state.current,allowedStation());
const merksatz='Sind bei einem geraden Kreiskegel der Radius r und die Höhe h gegeben, berechne ich zuerst die Mantellinie s = √(r² + h²). Danach setze ich r und s in O = πr² + πrs ein. Ich rechne mit ungerundeten Zwischenwerten, runde das Endergebnis auf zwei Nachkommastellen und gebe eine Flächeneinheit an.';
function fieldHTML(t,f){const key=t.id+'_'+f.id,value=state.values[key]??'';
if(f.type==='radio')return `<fieldset class="choice-set"><legend>${f.label}</legend>${f.options.map(([v,l])=>`<label class="choice"><input type="radio" name="${key}" value="${v}" ${value===v?'checked':''}>${l}</label>`).join('')}</fieldset>`;
return `<label for="${key}">${f.label}${f.type==='select'?`<select id="${key}" name="${key}" aria-describedby="fb_${t.id}"><option value="">Bitte wählen …</option>${f.options.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('')}</select>`:`<input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" id="${key}" name="${key}" value="${esc(value)}" aria-describedby="fb_${t.id}">`}</label>`;}
function taskHTML(id){const t=tasks[id],done=state.done[id],h=state.hints[id]||0;return `<section class="card" id="card_${id}" aria-labelledby="title_${id}"><h3 tabindex="-1" id="title_${id}">${t.title}${done?' <span class="small">✓</span>':''}</h3>${t.body?`<p>${t.body}</p>`:''}<form data-task="${id}" novalidate><fieldset ${done?'disabled':''}><legend class="task-kicker">${done?'Bearbeitet':'Deine Antwort'}</legend><div class="${t.fields[0].type==='radio'?'':'fields'}">${t.fields.map(f=>fieldHTML(t,f)).join('')}</div><button class="primary" type="submit">Antwort prüfen</button></fieldset><div class="feedback ${done?'good':''}" id="fb_${id}" role="status" aria-live="polite" aria-atomic="true">${done?`<strong>Das stimmt. Dein Rechenweg:</strong> ${t.solution}`:''}</div></form><div class="help-row" id="help_${id}">${helpHTML(id,h)}</div></section>`;}
function helpHTML(id,h){const t=tasks[id],all=t.hints.concat(t.hints[t.hints.length-1]===t.solution?[]:[`Lösungsweg: ${t.solution}`]);return `<ol class="hint-list">${all.slice(0,h).map((x,i)=>`<li><b>Hilfe ${i+1}</b><br>${x}</li>`).join('')}</ol>${!state.done[id]&&h<all.length?`<button type="button" data-hint="${id}" aria-controls="help_${id}">${h?'Nächste Hilfe':state.attempts[id]>=2?'Zusätzliche Hilfe öffnen':'Hilfe öffnen'} <span class="muted">(${h+1}/${all.length})</span></button>`:''}`;}
function sequence(ids){let html='';for(const id of ids){html+=taskHTML(id);if(!state.done[id])break;}return html;}
function render(focus=false){const n=state.current,complete=stationDone(n),count=titles.filter((_,i)=>stationDone(i)).length;
$('progressText').textContent=`${count} von 7 geschafft`;$('percent').textContent=`${Math.round(count/7*100)} %`;$('progress').value=count;
$('stationList').innerHTML=titles.map((t,i)=>`<li class="${i===n?'active ':''}${stationDone(i)?'done':''}" ${i===n?'aria-current="step"':''}><span class="num" aria-hidden="true">${stationDone(i)?'✓':i+1}</span><span class="station-name">${t}</span><span class="small" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Station ${i+1}: ${t}${stationDone(i)?', abgeschlossen':''}</span></li>`).join('');
let body='';
if(n===0)body=`<div class="intro-grid"><div><p>Du kennst die Oberflächenformel. Heute berechnest du die Oberfläche, wenn nur <b class="r">r</b> und <b class="h">h</b> gegeben sind.</p><div class="formula math">O = π<span class="r">r</span>² + π<span class="r">r</span><span class="s">s</span></div><p><b>In der Oberflächenformel kommt s vor. Gegeben sind aber nur r und h. Wie kannst du s bestimmen?</b></p></div>${cone(0)}</div><div class="legend"><span class="r">r · Radius</span><span class="h">h · senkrechte Höhe</span><span class="s">s · Mantellinie</span></div>${taskHTML('intro')}`;
if(n===1)body=`<p>Ein Schnitt durch die Spitze und den Mittelpunkt zeigt das Dreieck. Öffne zuerst den Axialschnitt und dann seine rechte Hälfte.</p><div class="mode-buttons" role="group" aria-label="Schnitt schrittweise entdecken">${['Kegel','1 · Axialschnitt','2 · Rechte Hälfte'].map((x,i)=>`<button data-view="${i}" aria-pressed="${state.view===i}" ${i===2&&state.view<1?'disabled':''}>${x}</button>`).join('')}</div><div id="diagramArea">${cone(state.view,true,state.view===2)}</div>${state.view===2||state.done.triangle?taskHTML('triangle'):'<p class="notice">Betrachte die rechte Hälfte. Danach kannst du die Strecken zuordnen.</p>'}`;
if(n===2)body=`<p>Vom Quadrat zur Länge: Setze ein, addiere und ziehe dann die Wurzel.</p><div class="notice">Taschenrechner nutzen. Dezimalkomma und Dezimalpunkt sind möglich. Runde auf zwei Nachkommastellen; genauere Werte werden ebenfalls akzeptiert.</div>${sequence(groups[2])}`;
if(n===3)body=`<div class="formula"><div class="math"><span class="s">s</span> = √(<span class="r">r</span>² + <span class="h">h</span>²) = 5,00 cm</div><div class="inline-steps"><span>G = πr²</span><span>M = πrs</span><span>O = G + M</span></div></div>${taskHTML('surface')}${state.done.surface?'<div class="notice"><b>Auch direkt möglich:</b> O = πr² + πrs. Beide Wege sind gleichwertig. Runde erst das Ergebnis, nicht die Werte für die Weiterrechnung.</div>':''}`;
if(n===4)body=`<p>Finde jeweils den Fehler <b>und</b> die passende Begründung. Nutze die bekannte Formelkarte, wenn du unsicher bist.</p>${sequence(groups[4])}`;
if(n===5)body=`<p>Rechne zuerst mit kurzem Gerüst, danach selbstständig im Heft. Die Hilfen öffnen sich einzeln und sind freiwillig.</p><div class="notice">Zwischenwerte im Taschenrechner ungerundet weiterverwenden. Erst die angezeigten Ergebnisse auf zwei Nachkommastellen runden.</div>${sequence(groups[5])}${stationDone(5)?`<section class="card"><h3>Mehr Herausforderung?</h3><p>Der Pflichtteil ist geschafft. Du kannst zum Abschluss gehen oder freiwillig weiterdenken. Zusatzzeit: etwa 3–5 Minuten.</p><button id="extrasBtn" aria-expanded="${state.extras}" aria-controls="extras">${state.extras?'Zusatzaufgaben schließen':'Zusatzaufgaben öffnen'}</button><div id="extras" ${state.extras?'':'hidden'}>${taskHTML('extra1')}${taskHTML('extra2')}</div></section>`:''}`;
if(n===6)body=taskHTML('finalTask')+(state.done.finalTask?`<section class="card"><p class="eyebrow">Das bleibt</p><h3>Deine Strategie in sechs Schritten</h3><ol class="strategy"><li>Rechtwinkliges Dreieck im halben Axialschnitt erkennen.</li><li>Mantellinie mit Pythagoras berechnen: s = √(r² + h²).</li><li>Grundfläche G = πr² und Mantelfläche M = πrs berechnen.</li><li>Flächen addieren: O = G + M.</li><li>Das Ergebnis auf zwei Nachkommastellen runden.</li><li>Die passende Flächeneinheit angeben.</li></ol><h3>Merksatz fürs Heft</h3><p class="memory" id="memory">${merksatz}</p><button id="copyBtn">Merksatz kopieren</button><p id="copyStatus" role="status" aria-live="polite" class="small muted"></p></section><section class="card"><h3>Wie sicher bist du?</h3><p class="small muted">Deine Einschätzung bleibt nur auf diesem Gerät. Es gibt keine Übermittlung an deine Lehrkraft.</p><fieldset class="choice-set"><legend>Wähle die Aussage, die gerade zu dir passt.</legend>${[['alone','Ich kann den Lösungsweg selbstständig anwenden.'],['help','Ich kann ihn mit einer Hilfe anwenden.'],['triangle','Ich muss das rechtwinklige Dreieck noch einmal üben.']].map(([v,l])=>`<label class="choice"><input type="radio" name="self" value="${v}" ${state.self===v?'checked':''}>${l}</label>`).join('')}</fieldset><div id="selfResponse" role="status" aria-live="polite">${selfResponse()}</div></section>`:'');
$('main').innerHTML=`<div class="station-top"><p class="eyebrow">Station ${n+1} von 7</p><span class="time">${times[n]}</span></div><h2 id="stationTitle">${titles[n]}</h2>${body}`;
$('prev').disabled=n===0;$('next').disabled=!complete||n===6;$('next').textContent=n===6?'Abgeschlossen':n===5?'Zum Abschluss →':'Weiter →';
$('navStatus').textContent=n===6?(stationDone(6)?'Alle 7 Stationen abgeschlossen.':state.done.finalTask?'Wähle noch deine Selbsteinschätzung.':'Löse die Abschlussaufgabe.'):(complete?'Station geschafft. Du kannst weitergehen.':'Bearbeite die Aufgaben, um weiterzugehen.');
if(focus){$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}save();}
function selfResponse(){if(!state.self)return '';const notes={alone:'Du kannst die Rechenkette jetzt selbstständig anwenden.',help:'Nutze beim nächsten Kegel die Formelkarte und öffne Hilfen schrittweise.',triangle:'Gehe über „Zurück“ noch einmal zu Station 2. Achte auf den Radius und den rechten Winkel am Mittelpunkt.'};return `<div class="complete-banner"><h3>Geschafft · 7 von 7 Stationen</h3><p>${notes[state.self]}</p><p class="small">Übernimm den Merksatz in dein Heft. Deine Eingaben bleiben beim Zurückgehen erhalten.</p></div>`;}
function readInputs(form){new FormData(form).forEach((v,k)=>state.values[k]=v);save();}
function check(id,form){if(state.done[id])return;readInputs(form);const t=tasks[id],errors=[];let swap=id==='sq'&&near(numeric(state.values.sq_a),4)&&near(numeric(state.values.sq_b),3);
for(const f of t.fields){const raw=state.values[id+'_'+f.id]??'',a=numeric(raw);let ok=f.type==='number'?(near(a,f.answer)||swap):raw===f.answer,msg='';
if(!ok){if(!String(raw).trim())msg=f.id==='unit'?'Wähle noch eine Einheit. Der Oberflächeninhalt ist eine Fläche und braucht cm².':'Trage eine Antwort ein oder wähle eine Möglichkeit aus.';
else if(f.type==='number'){if(!Number.isFinite(a))msg='Gib hier nur die Zahl ein, mit Komma oder Punkt. Die Einheit steht am Feld oder wird separat gewählt.';
else {const special=(f.wrong||[]).find(([v])=>near(a,v,.03));msg=special?special[1]:(Math.abs(a-f.answer)<=Math.max(.04,Math.abs(f.answer)*.001)?'Dein Rechenweg kann stimmen. Prüfe, ob du zu früh gerundet hast. Rechne mit ungerundeten Zwischenwerten und der π-Taste weiter.':id==='sq'&&near(a,6)?'Du verwendest den Durchmesser. Die Kathete vom Mittelpunkt zum Rand ist der Radius 3 cm.':'Prüfe deine eingesetzten Werte und die Rechenreihenfolge. Nutze bei Bedarf die nächste Hilfe.');}}
else msg=f.error||'Prüfe deine Auswahl mithilfe der Zeichnung.';
errors.push({field:f.id,label:f.label,msg});}
const el=form.elements.namedItem(id+'_'+f.id);if(el&&el.setAttribute)el.setAttribute('aria-invalid',String(!ok));}
if(errors.length){state.attempts[id]=(state.attempts[id]||0)+1;const fb=$('fb_'+id);fb.className='feedback';fb.innerHTML='<strong>Noch einmal genau hinsehen:</strong><ul>'+errors.map(e=>`<li><b>${esc(e.label)}:</b> ${esc(e.msg)}</li>`).join('')+'</ul>'+(state.attempts[id]>=2?'<p>Du hast es mehrfach versucht. Unter der Rückmeldung kannst du eine zusätzliche Hilfe öffnen.</p>':'');$('help_'+id).innerHTML=helpHTML(id,state.hints[id]||0);save();}
else{state.done[id]=true;save();render();const fb=$('fb_'+id);fb.tabIndex=-1;fb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest',behavior:'auto'});}}
function showModal(type){returnFocus=$(type==='reset'?'resetBtn':'formulaBtn');const modal=$('modal');modal.innerHTML=type==='reset'?'<h2 id="modalTitle">Neu beginnen?</h2><p>Alle Eingaben, geöffneten Hilfen und dein Fortschritt in diesem Lernpfad werden auf diesem Gerät gelöscht.</p><div class="modal-actions"><button data-close>Abbrechen</button><button class="primary" id="confirmReset">Ja, neu beginnen</button></div>':`<h2 id="modalTitle">Deine Formelkarte</h2><p>Für einen geraden Kreiskegel:</p><div class="formula math"><span class="s">s</span> = √(<span class="r">r</span>² + <span class="h">h</span>²)<br>G = πr²<br>M = πrs<br>O = G + M = πr² + πrs</div><div class="legend"><span class="r">r · Radius</span><span class="h">h · Höhe</span><span class="s">s · Mantellinie</span></div><p class="notice">Bei gegebenem Durchmesser: r = d : 2.<br>Zwischenwerte ungerundet weiterverwenden. Endergebnis auf zwei Nachkommastellen runden. Flächeneinheit nicht vergessen.</p><div class="modal-actions"><button data-close class="primary">Zurück zur Aufgabe</button></div>`;$('overlay').hidden=false;document.body.style.overflow='hidden';document.querySelector('.shell').setAttribute('inert','');document.querySelector('header').setAttribute('inert','');modal.querySelector('button').focus();}
function closeModal(){ $('overlay').hidden=true;document.body.style.overflow='';document.querySelector('.shell').removeAttribute('inert');document.querySelector('header').removeAttribute('inert');if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
async function copyMemory(){let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(merksatz);copied=true;}}catch(e){}if(!copied){const ta=document.createElement('textarea');ta.value=merksatz;ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);try{copied=document.execCommand('copy');}catch(e){}ta.remove();$('copyBtn').focus();}if(copied)$('copyStatus').textContent='Merksatz kopiert. Du kannst ihn jetzt einfügen.';else{const range=document.createRange();range.selectNodeContents($('memory'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('copyStatus').textContent='Automatisches Kopieren ist hier nicht verfügbar. Der Text ist markiert: Nutze „Kopieren“ im Auswahlmenü oder schreibe den Merksatz ab.';}}
document.addEventListener('input',e=>{if(e.target.name&&e.target.name!=='self'){state.values[e.target.name]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.name==='self'){state.self=e.target.value;save();const scroll=window.scrollY;render();const choice=document.querySelector(`input[name="self"][value="${state.self}"]`);choice.focus({preventScroll:true});window.scrollTo(0,scroll);}else if(e.target.name){state.values[e.target.name]=e.target.value;save();}});
document.addEventListener('submit',e=>{if(e.target.matches('form[data-task]')){e.preventDefault();check(e.target.dataset.task,e.target);}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-edge]');if(!b)return;if(b.id==='prev'&&state.current>0){state.current--;render(true);}else if(b.id==='next'&&state.current<6&&stationDone(state.current)){state.current++;render(true);}else if(b.dataset.view!==undefined){state.view=Number(b.dataset.view);render();document.querySelector(`[data-view="${state.view}"]`).focus({preventScroll:true});}else if(b.dataset.hint){const id=b.dataset.hint;state.hints[id]=(state.hints[id]||0)+1;$('help_'+id).innerHTML=helpHTML(id,state.hints[id]);const li=$('help_'+id).querySelector('li:last-child');li.tabIndex=-1;li.focus({preventScroll:true});li.scrollIntoView({block:'nearest'});save();}else if(b.dataset.edge&&!state.done.triangle){const select=$('triangle_hyp');if(select){select.value=b.dataset.edge;state.values.triangle_hyp=b.dataset.edge;select.focus({preventScroll:true});save();}}else if(b.id==='formulaBtn')showModal('formula');else if(b.id==='resetBtn')showModal('reset');else if(b.hasAttribute('data-close'))closeModal();else if(b.id==='confirmReset'){state=fresh();closeModal();render(true);}else if(b.id==='extrasBtn'){state.extras=!state.extras;render();$('extrasBtn').focus({preventScroll:true});}else if(b.id==='copyBtn')copyMemory();});
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input,select,[tabindex="0"]')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.matches('[data-edge]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}else if(e.key==='Enter'&&e.target.matches('input:not([type="radio"]),select')){const form=e.target.closest('form[data-task]');if(form){e.preventDefault();check(form.dataset.task,form);}}});
render();
</script></body></html>
