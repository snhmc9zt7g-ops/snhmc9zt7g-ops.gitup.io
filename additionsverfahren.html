    function shuffleArray(array) {
      const copy = Array.isArray(array) ? [...array] : [];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/−/g, "-")
        .replace(/,/g, ".")
        .replace(/\s+/g, "")
        .replace(/[{}\[\]()]/g, "")
        .replace(/\|/g, ";")
        .replace(/lösung|loesung|l=/g, "");
    }

    function parseNumber(raw) {
      let text = String(raw ?? "").trim().replace(/−/g, "-").replace(/,/g, ".");
      if (!text) return null;
      if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(text)) {
        const [a, b] = text.split("/").map(Number);
        return b === 0 ? null : a / b;
      }
      const number = Number(text);
      return Number.isFinite(number) ? number : null;
    }

    function closeNumber(a, b) {
      return Math.abs(Number(a) - Number(b)) < 1e-9;
    }

    function parseSolutionInput(raw, variables) {
      const input = String(raw ?? "").trim();
      if (!input) return null;
      const result = {};
      const normalized = input.replace(/−/g, "-").replace(/,/g, ".").toLowerCase();
      variables.forEach(variable => {
        const escaped = variable.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(escaped + "\\s*=\\s*(-?\\d+(?:\\.\\d+)?(?:\\/-?\\d+(?:\\.\\d+)?)?)", "i");
        const match = normalized.match(regex);
        if (match) result[variable] = parseNumber(match[1]);
      });
      if (variables.every(variable => typeof result[variable] === "number")) return result;

      const compact = normalizeText(input);
      const numbers = compact.match(/-?\d+(?:\.\d+)?(?:\/-?\d+(?:\.\d+)?)?/g)?.map(parseNumber).filter(value => typeof value === "number") || [];
      if (numbers.length >= variables.length) {
        const ordered = {};
        variables.forEach((variable, index) => ordered[variable] = numbers[index]);
        return ordered;
      }
      return null;
    }

    function checkSolution(raw, solution) {
      if (!solution) return false;
      const variables = Object.keys(solution.vars || {});
      const parsed = parseSolutionInput(raw, variables);
      if (!parsed) return false;
      return variables.every(variable => closeNumber(parsed[variable], solution.vars[variable]));
    }

    function checkCloze(raw, accepted) {
      return accepted.some(value => {
        const a = parseNumber(raw);
        const b = parseNumber(value);
        if (a !== null && b !== null) return closeNumber(a, b);
        return normalizeText(raw) === normalizeText(value);
      });
    }

    function sameSet(a, b) {
      return a.length === b.length && a.every(value => b.includes(value));
    }

    function sameOrder(a, b) {
      return a.length === b.length && a.every((value, index) => value === b[index]);
    }

    function formatParts(text) {

      });
    }

    function runSelfTests() {
      const tests = [
        ["parse x/y", () => checkSolution("x=3; y=4", { vars: { x: 3, y: 4 } })],
        ["parse pair", () => checkSolution("(3;4)", { vars: { x: 3, y: 4 } })],
        ["parse pipe", () => checkSolution("3|4", { vars: { x: 3, y: 4 } })],
        ["parse decimal comma", () => checkSolution("x=6,0; y=4", { vars: { x: 6, y: 4 } })],
        ["cloze numeric", () => checkCloze("20", ["20"])],
        ["same order", () => sameOrder(["a", "b"], ["a", "b"])],
        ["same set", () => sameSet(["a", "b"], ["b", "a"])]
      ];
      tests.forEach(([name, fn]) => {
        try { console.assert(fn(), "Test fehlgeschlagen: " + name); }
        catch (error) { console.error("Testfehler:", name, error); }
      });
    }
    runSelfTests();

    function Button({ children, onClick, variant = "primary", disabled = false, className = "", type = "button" }) {
      const variants = {
        primary: "bg-gradient-to-r from-sky-500 to-cyan-400 text-white shadow-lg hover:brightness-110",
        secondary: "bg-white/10 text-white border border-white/20 hover:bg-white/20",
        dark: "bg-slate-900 text-white hover:bg-slate-800",
        light: "bg-white text-slate-900 border border-slate-200 hover:bg-slate-50",
        success: "bg-gradient-to-r from-emerald-500 to-lime-400 text-white hover:brightness-110",
        danger: "bg-gradient-to-r from-rose-500 to-red-500 text-white hover:brightness-110"
      };
      return <button type={type} onClick={onClick} disabled={disabled} className={`rounded-2xl px-4 py-3 font-bold transition active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-50 ${variants[variant]} ${className}`}>{children}</button>;
    }

    function Badge({ children, tone = "sky" }) {

      return <span className={`inline-flex rounded-full px-3 py-1 text-xs font-black ${tones[tone]}`}>{children}</span>;
    }

    function Header({ profile, progress, onMenu, onTeacher }) {
      const done = progress.completed.length;
      return <header className="sticky top-0 z-30 border-b border-white/10 bg-slate-950/75 backdrop-blur-xl"><div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-3 py-3 sm:px-5"><button onClick={onMenu} className="flex items-center gap-3 text-left"><div className={`grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br ${profile?.color || COLORS[0].value} text-2xl shadow-glow`}>{profile?.avatar || "🚀"}</div><div><div className="text-sm text-slate-300">{profile?.mode === "team" ? "Team" : "Profil"}</div><div className="font-black leading-tight">{profile?.name || "Gast"}</div></div></button><div className="hidden flex-1 items-center gap-3 px-6 md:flex"><div className="h-3 flex-1 overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full bg-gradient-to-r from-sky-400 via-violet-400 to-emerald-400" style={{ width: `${Math.min(100, done * 10)}%` }} /></div><span className="text-sm font-bold text-slate-200">{done}/10 Level</span></div><div className="flex items-center gap-2"><div className="rounded-2xl border border-amber-300/30 bg-amber-400/10 px-3 py-2 text-sm font-black text-amber-200">⭐ {progress.xp} XP</div><button onClick={onTeacher} aria-label="Menü" title="Menü" className="rounded-xl px-3 py-2 text-white/25 hover:bg-white/10 hover:text-white">⋮</button></div></div></header>;

    function Welcome({ onStart }) {
      const [mode, setMode] = useState("single");
      const [name, setName] = useState("");
      const [support, setSupport] = useState("standard");
      const [avatar, setAvatar] = useState(AVATARS[0]);
      const [color, setColor] = useState(COLORS[0].value);
      function randomName() { setName(NICKNAMES[Math.floor(Math.random() * NICKNAMES.length)]); }
      function submit() { onStart({ mode, name: name.trim() || NICKNAMES[Math.floor(Math.random() * NICKNAMES.length)], support, avatar, color }); }
      return <main className="mx-auto grid min-h-screen max-w-6xl place-items-center px-4 py-8"><div className="grid w-full gap-6 lg:grid-cols-[1.05fr_.95fr]"><section className="glass rounded-[2rem] p-6 shadow-2xl sm:p-8"><div className="mb-6 inline-flex rounded-full border border-sky-300/30 bg-sky-400/10 px-4 py-2 text-sm font-bold text-sky-100">Mission Additio · Jahrgangsstufe 8</div><h1 className="text-4xl font-black leading-tight sm:text-6xl">Rette die Stadt der <span className="bg-gradient-to-r from-sky-300 via-cyan-200 to-emerald-200 bg-clip-text text-transparent">Gleichungen</span></h1><p className="mt-5 max-w-2xl text-lg leading-relaxed text-slate-200">In Additio sind zehn Energie-Tore verschlossen. Jedes Tor öffnet sich nur, wenn du lineare Gleichungssysteme mit dem Additionsverfahren entschlüsselst.</p><div className="mt-8 grid gap-4 sm:grid-cols-3">{[["🧩","kurze Einheiten","Info und Aufgabe wechseln sich ab."],["💡","Hilfen","Tipps werden stufenweise konkreter."],["🏁","Boss-Finale","Zeitspiel zum Abschluss."]].map(([icon,title,text]) => <div key={title} className="rounded-3xl border border-white/10 bg-white/10 p-4"><div className="text-3xl">{icon}</div><div className="mt-2 font-black">{title}</div><div className="mt-1 text-sm text-slate-300">{text}</div></div>)}</div></section><section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-7"><h2 className="text-2xl font-black">Profil einrichten</h2><p className="mt-1 text-sm text-slate-600">Wähle Modus, Namen und Lernprofil.</p><div className="mt-5 grid grid-cols-2 gap-3"><Button variant={mode === "single" ? "dark" : "light"} onClick={() => setMode("single")}>👤 Einzel</Button><Button variant={mode === "team" ? "dark" : "light"} onClick={() => setMode("team")}>👥 Team</Button></div><label className="mt-5 block"><span className="text-sm font-black text-slate-700">{mode === "team" ? "Teamname" : "Name"}</span><div className="mt-2 flex gap-2"><input value={name} onChange={e => setName(e.target.value)} placeholder={mode === "team" ? "Teamname eingeben" : "Namen eingeben"} className="min-w-0 flex-1 rounded-2xl border border-slate-300 bg-white px-4 py-3 font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" /><Button variant="light" onClick={randomName}>🎲</Button></div></label><div className="mt-5"><div className="text-sm font-black text-slate-700">Unterstützung</div><div className="mt-2 grid gap-2 sm:grid-cols-3">{[["basis","Basis","mehr Tipps"],["standard","Standard","ausgewogen"],["profi","Profi","weniger Hilfe"]].map(([id,label,sub]) => <button key={id} onClick={() => setSupport(id)} className={`rounded-2xl border p-3 text-left ${support === id ? "border-sky-500 bg-sky-50 ring-4 ring-sky-100" : "border-slate-200 bg-white hover:bg-slate-50"}`}><div className="font-black">{label}</div><div className="text-xs text-slate-500">{sub}</div></button>)}</div></div><div className="mt-5"><div className="text-sm font-black text-slate-700">Avatar</div><div className="mt-2 flex flex-wrap gap-2">{AVATARS.map(a => <button key={a} onClick={() => setAvatar(a)} className={`grid h-12 w-12 place-items-center rounded-2xl text-2xl ${avatar === a ? "bg-slate-900 text-white ring-4 ring-slate-200" : "bg-slate-100 hover:bg-slate-200"}`}>{a}</button>)}</div></div><div className="mt-5"><div className="text-sm font-black text-slate-700">Farbe</div><div className="mt-2 flex flex-wrap gap-2">{COLORS.map(c => <button key={c.name} title={c.name} onClick={() => setColor(c.value)} className={`h-11 w-16 rounded-2xl bg-gradient-to-br ${c.value} ${color === c.value ? "ring-4 ring-slate-300" : "hover:scale-105"}`} />)}</div></div><Button onClick={submit} className="mt-7 w-full text-lg">Mission starten 🚀</Button></section></div></main>;
    }

    function ProgressMap({ progress, profile, onLevel }) {
      const pos = Math.min(9, Math.max(0, progress.unlocked - 1));
      return <div className="glass rounded-[2rem] p-5 shadow-xl"><div className="mb-4 flex items-center justify-between gap-3"><div><h2 className="text-xl font-black">Additio-Karte</h2><p className="text-sm text-slate-300">Dein Avatar bewegt sich mit jedem Level weiter.</p></div><div className="rounded-2xl bg-white/10 px-3 py-2 text-sm font-black">Boss: {progress.completed.includes(10) ? "frei" : "gesperrt"}</div></div><div className="relative mt-8 px-3 pb-5 pt-12"><div className="map-line absolute left-8 right-8 top-[72px]" /><div className={`pulse absolute top-4 z-10 grid h-14 w-14 place-items-center rounded-3xl bg-gradient-to-br ${profile.color} text-3xl shadow-glow`} style={{ left: `calc(${(pos / 9) * 100}% - ${pos === 0 ? "0px" : pos === 9 ? "56px" : "28px"})` }}>{profile.avatar}</div><div className="relative grid grid-cols-10 gap-1">{LEVELS.map(level => { const locked = level.id > progress.unlocked; const done = progress.completed.includes(level.id); return <button key={level.id} onClick={() => !locked && onLevel(level.id)} disabled={locked} className={`mt-8 flex h-12 items-center justify-center rounded-2xl text-sm font-black transition ${done ? "bg-emerald-400 text-emerald-950" : locked ? "bg-slate-700/70 text-slate-400" : "bg-white text-slate-900 hover:scale-105"}`}>{locked ? "🔒" : done ? "✓" : level.id}</button>; })}</div></div></div>;
    }

    function MainMenu({ profile, progress, onStartLevel, onBoss, onResetProfile }) {
      return <main className="mx-auto max-w-6xl px-4 py-6 sm:px-5"><div className="mb-6 grid gap-5 lg:grid-cols-[1fr_320px]"><ProgressMap progress={progress} profile={profile} onLevel={onStartLevel} /><aside className="glass rounded-[2rem] p-5 shadow-xl"><div className="floaty text-4xl">{profile.avatar}</div><h2 className="mt-3 text-2xl font-black">Willkommen, {profile.name}</h2><p className="mt-2 text-sm text-slate-300">Lernprofil: <span className="font-black text-white">{profile.support === "basis" ? "Basis" : profile.support === "profi" ? "Profi" : "Standard"}</span></p><div className="mt-4 rounded-3xl bg-white/10 p-4"><div className="text-sm text-slate-300">Gesamtfortschritt</div><div className="mt-1 text-3xl font-black">{progress.completed.length}/10</div><div className="mt-3 h-3 overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full bg-gradient-to-r from-sky-400 to-emerald-400" style={{ width: `${progress.completed.length * 10}%` }} /></div></div><Button variant={progress.completed.includes(10) ? "success" : "secondary"} disabled={!progress.completed.includes(10)} onClick={onBoss} className="mt-4 w-full">Boss-Level starten 🏁</Button><Button variant="secondary" onClick={onResetProfile} className="mt-3 w-full">Profil wechseln</Button></aside></div><section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">{LEVELS.map(level => { const locked = level.id > progress.unlocked; const done = progress.completed.includes(level.id); return <article key={level.id} className={`soft overflow-hidden rounded-[1.7rem] shadow-xl transition ${locked ? "opacity-60" : "hover:-translate-y-1"}`}><div className={`h-3 bg-gradient-to-r ${level.color}`} /><div className="p-5"><div className="flex items-start justify-between gap-3"><div className="text-4xl">{locked ? "🔒" : level.icon}</div>{done ? <Badge tone="green">abgeschlossen</Badge> : locked ? <Badge tone="slate">gesperrt</Badge> : <Badge>frei</Badge>}</div><h3 className="mt-4 text-xl font-black">Level {level.id}: {level.title}</h3><p className="mt-1 text-sm text-slate-600">{level.subtitle}</p><div className="mt-4 flex justify-between text-sm text-slate-500"><span>{level.steps.filter(s => s.type === "task").length} Aufgaben</span><span>{level.steps.some(s => s.type === "worksheet") ? "mit AB-Phase" : "digital"}</span></div><Button disabled={locked} onClick={() => onStartLevel(level.id)} variant={done ? "light" : "dark"} className="mt-4 w-full">{done ? "Wiederholen" : locked ? "Gesperrt" : "Starten"}</Button></div></article>; })}</section></main>;
    }

    function MethodIntro({ level, onNext }) {
      return <section className="soft overflow-hidden rounded-[2rem] shadow-2xl"><div className={`h-3 bg-gradient-to-r ${level.color}`} /><div className="p-5 sm:p-8"><div className="mb-4 flex items-center gap-3"><div className={`grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br ${level.color} text-3xl shadow-lg`}>{level.icon}</div><div><div className="text-sm font-black uppercase tracking-wide text-slate-500">Level-Erklärung</div><h2 className="text-2xl font-black">{level.method.title}</h2></div></div><div className="grid gap-4 lg:grid-cols-[1fr_.9fr]"><ol className="space-y-3">{level.method.steps.map((step, index) => <li key={index} className="flex gap-3 rounded-3xl bg-slate-50 p-4"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-slate-900 text-sm font-black text-white">{index + 1}</span><span className="leading-relaxed text-slate-700">{formatParts(step)}</span></li>)}</ol><div className="rounded-3xl border border-sky-100 bg-sky-50 p-5"><div className="mb-2 text-sm font-black uppercase tracking-wide text-sky-700">Mini-Beispiel</div><pre className="overflow-x-auto whitespace-pre-wrap rounded-2xl bg-white p-4 font-mono text-sm font-black leading-relaxed text-slate-900">{level.method.example}</pre><div className="mt-5 rounded-2xl bg-white p-4 text-sm font-bold text-slate-600">Merke: Gleichheitszeichen stehen untereinander. Umformungen werden mit ⇔ notiert.</div></div></div><div className="mt-7 flex justify-end"><Button variant="dark" onClick={onNext}>Mit Level starten →</Button></div></div></section>;
    }

    function InfoCard({ step, onNext }) {
      return <section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-8"><div className="mb-4 flex items-center gap-3"><div className="grid h-12 w-12 place-items-center rounded-2xl bg-sky-100 text-2xl">💡</div><div><div className="text-sm font-black uppercase tracking-wide text-sky-700">InfoCard</div><h2 className="text-2xl font-black">{step.title}</h2></div></div><div className="space-y-3 text-lg leading-relaxed text-slate-700">{step.text.map((line, index) => <p key={index}>{formatParts(line)}</p>)}</div><div className="mt-7 flex justify-end"><Button variant="dark" onClick={onNext}>Verstanden →</Button></div></section>;
    }

    function WorksheetPhase({ step, onNext }) {
      const [time, setTime] = useState(step.duration || 15);
      useEffect(() => setTime(step.duration || 15), [step.id]);
      useEffect(() => { if (time <= 0) return; const timer = setTimeout(() => setTime(value => value - 1), 1000); return () => clearTimeout(timer); }, [time]);
      return <section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-8"><div className="flex flex-col gap-5 md:flex-row md:items-start md:justify-between"><div><div className="mb-2 inline-flex rounded-full bg-amber-100 px-3 py-1 text-xs font-black text-amber-900">Blended Learning</div><h2 className="text-3xl font-black">{step.title}</h2><p className="mt-3 max-w-3xl text-lg leading-relaxed text-slate-700">{step.prompt}</p></div><div className="grid h-24 w-24 shrink-0 place-items-center rounded-[2rem] bg-slate-900 text-center text-white shadow-xl"><div><div className="text-3xl font-black">{time}</div><div className="text-xs text-slate-300">Sek.</div></div></div></div><div className="mt-6 grid gap-3 md:grid-cols-3">{step.checklist.map(item => <div key={item} className="rounded-2xl border border-slate-200 bg-slate-50 p-4 font-semibold text-slate-700">□ {item}</div>)}</div><div className="mt-7 flex justify-end"><Button variant="dark" disabled={time > 0} onClick={onNext}>Phase abgeschlossen →</Button></div></section>;
    }

    function TaskGraphic({ type }) {
      if (type === "tickets") return <div className="my-4 grid gap-3 rounded-3xl bg-gradient-to-r from-rose-50 to-amber-50 p-4 sm:grid-cols-2"><div className="rounded-2xl bg-white p-4 shadow-sm"><div className="text-3xl">🎟️🎟️ 🍿🍿🍿</div><div className="mt-2 font-black">2t + 3p = 27 €</div></div><div className="rounded-2xl bg-white p-4 shadow-sm"><div className="text-3xl">🎟️🎟️🎟️🎟️ 🍿</div><div className="mt-2 font-black">4t + p = 29 €</div></div></div>;
      return null;
    }

    function HotspotChart({ task, value, onChange }) {
      const scale = 34, ox = 42, oy = 318;
      const sx = x => ox + x * scale;
      const sy = y => oy - y * scale;
      return <div className="my-4 overflow-hidden rounded-3xl bg-slate-50 p-3"><svg viewBox="0 0 360 340" className="mx-auto h-[320px] max-w-full">{[0,1,2,3,4,5,6,7,8].map(n => <g key={n}><line x1={sx(n)} y1={sy(0)} x2={sx(n)} y2={sy(8)} stroke="#cbd5e1"/><line x1={sx(0)} y1={sy(n)} x2={sx(8)} y2={sy(n)} stroke="#cbd5e1"/><text x={sx(n)-4} y={sy(0)+20} fontSize="11" fill="#64748b">{n}</text><text x={sx(0)-24} y={sy(n)+4} fontSize="11" fill="#64748b">{n}</text></g>)}<line x1={sx(0)} y1={sy(0)} x2={sx(8.2)} y2={sy(0)} stroke="#0f172a" strokeWidth="2"/><line x1={sx(0)} y1={sy(0)} x2={sx(0)} y2={sy(8.2)} stroke="#0f172a" strokeWidth="2"/>{task.chart.lines.map((line, index) => <g key={line.label}><line x1={sx(line.from[0])} y1={sy(line.from[1])} x2={sx(line.to[0])} y2={sy(line.to[1])} stroke={index === 0 ? "#0284c7" : "#db2777"} strokeWidth="4" strokeLinecap="round"/><text x={sx(line.to[0])-58} y={sy(line.to[1])-12} fontSize="13" fontWeight="800" fill={index === 0 ? "#0284c7" : "#db2777"}>{line.label}</text></g>)}{task.chart.points.map(point => <g key={point.id} onClick={() => onChange(point.id)} className="cursor-pointer"><circle cx={sx(point.x)} cy={sy(point.y)} r="14" fill={value === point.id ? "#22c55e" : "#f8fafc"} stroke={value === point.id ? "#166534" : "#0f172a"} strokeWidth="3"/><text x={sx(point.x)-5} y={sy(point.y)+5} fontSize="14" fontWeight="900" fill="#0f172a">{point.label}</text></g>)}</svg></div>;
    }

    function HintBox({ task, hintsVisible }) {
      const visibleHints = (task.hints || []).slice(0, hintsVisible);
      if (!visibleHints.length) return null;
      return <div className="my-5 rounded-3xl bg-sky-50 p-4 text-sky-950"><div className="font-black">Hilfen zur aktuellen Aufgabe</div><div className="mt-3 space-y-3">{visibleHints.map((hint, index) => <div key={index} className="rounded-2xl bg-white/80 p-3 text-sm leading-relaxed text-slate-800"><div className="font-black text-slate-900">{index === 0 ? "Tipp" : `Hilfe ${index + 1}`}</div><p className="mt-1 font-semibold">{hint}</p>{index === task.hints.length - 1 && (
              <div className="mt-3 rounded-2xl border border-sky-200 bg-sky-50 p-3 text-xs font-bold leading-relaxed text-slate-700">
                Schreibe jetzt deinen eigenen Rechenweg auf. Die vollständige Lösung wird nicht angezeigt, damit du den entscheidenden Schritt selbst durchführen kannst.
              </div>
            )}</div>)}</div></div>;
    }

    function FeedbackBox({ feedback, onNext }) {
      if (!feedback) return null;
      return <div className={`my-5 rounded-3xl border p-4 ${feedback.ok ? "border-emerald-200 bg-emerald-50 text-emerald-950" : "border-amber-200 bg-amber-50 text-amber-950"}`}><div className="flex items-start gap-3"><div className="text-2xl">{feedback.ok ? "✅" : "💡"}</div><div className="flex-1"><div className="font-black">{feedback.title}</div><div className="mt-1 text-sm leading-relaxed">{feedback.message}</div>{feedback.ok && <Button variant="success" onClick={onNext} className="mt-4">Weiter zur nächsten Station →</Button>}</div></div></div>;
    }

    function TaskRenderer({ task, support, teacherSolution, onDone }) {
      const [attempts, setAttempts] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [single, setSingle] = useState("");
      const [multi, setMulti] = useState([]);
      const [text, setText] = useState("");
      const [cloze, setCloze] = useState({});
      const [matches, setMatches] = useState({});
      const [order, setOrder] = useState([]);
      const [dragState, setDragState] = useState({});
      const [selectedCard, setSelectedCard] = useState(null);
      const [hotspot, setHotspot] = useState("");
      const [hintsVisible, setHintsVisible] = useState(support === "basis" ? 1 : 0);

      useEffect(() => {
        setAttempts(0); setFeedback(null); setSingle(""); setMulti([]); setText(""); setCloze({}); setMatches({}); setOrder([]); setDragState({}); setSelectedCard(null); setHotspot(""); setHintsVisible(support === "basis" ? 1 : 0);
      }, [task.id, support]);

      const shuffledOptions = useMemo(() => shuffleArray(task.options), [task.id]);
      const shuffledChoices = useMemo(() => shuffleArray(task.choices), [task.id]);
      const shuffledItems = useMemo(() => shuffleArray(task.items), [task.id]);
      const shuffledCards = useMemo(() => shuffleArray(task.cards), [task.id]);
      const hasMoreHints = hintsVisible < (task.hints || []).length;

      function revealHint() { setHintsVisible(value => Math.min((task.hints || []).length, value + 1)); }
      function toggleMulti(option) { setMulti(old => old.includes(option) ? old.filter(value => value !== option) : [...old, option]); }
      function addOrder(item) { if (!order.includes(item)) setOrder([...order, item]); }
      function setCardBin(cardId, bin) { setDragState(old => ({ ...old, [cardId]: bin })); setSelectedCard(null); }

      function evaluate() {
        let ok = false;
        if (["single", "error", "mini"].includes(task.kind)) ok = single === task.answer;
        if (task.kind === "multiple") ok = sameSet(multi, task.answer);
        if (task.kind === "input") ok = checkSolution(text, task.solution);
        if (task.kind === "cloze") ok = Object.entries(task.answers).every(([id, accepted]) => checkCloze(cloze[id], accepted));
        if (task.kind === "matching") ok = task.items.every(item => matches[item.id] === task.answer[item.id]);
        if (["sort", "reorder"].includes(task.kind)) ok = sameOrder(order, task.answer);
        if (task.kind === "dragdrop") ok = task.cards.every(card => dragState[card.id] === task.answer[card.id]);
        if (task.kind === "hotspot") ok = hotspot === task.answer;

        if (ok) {
          setFeedback({ ok: true, title: "Richtig gelöst!", message: task.explanation || "Sehr gut." });
        } else {
          const nextAttempts = attempts + 1;
          setAttempts(nextAttempts);
          setHintsVisible(old => Math.min((task.hints || []).length, Math.max(old, nextAttempts)));
          const hint = task.hints?.[Math.min(nextAttempts - 1, task.hints.length - 1)] || "Prüfe deine Eingabe noch einmal.";
          setFeedback({ ok: false, title: nextAttempts >= 3 ? "Fast geschafft – jetzt konkret:" : "Noch nicht ganz.", message: hint });
        }
      }

      const difficultyTone = task.difficulty === "Profi" ? "purple" : task.difficulty === "Mittel" ? "yellow" : "green";
      const solutionText = task.solutionText || (task.answer ? "Richtig ist: " + task.answer : "Nutze die Hilfen.");

      return <section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-8"><div className="mb-4 flex flex-wrap items-start justify-between gap-3"><div><div className="mb-2 flex flex-wrap gap-2"><Badge tone={difficultyTone}>{task.difficulty}</Badge><Badge>{task.xp || 0} XP</Badge>{support === "basis" && <Badge tone="green">Hilfen aktiv</Badge>}{support === "profi" && <Badge tone="purple">Profi-Modus</Badge>}</div><h2 className="text-2xl font-black">{task.title}</h2></div><div className="rounded-2xl bg-slate-100 px-3 py-2 text-sm font-black text-slate-700">Versuch {attempts + 1}</div></div><p className="text-lg leading-relaxed text-slate-700">{task.prompt}</p>{task.equation && <div className="mt-4 overflow-x-auto rounded-3xl bg-slate-950 p-4 font-mono text-base font-black text-sky-100 sm:text-lg">{task.equation}</div>}<TaskGraphic type={task.graphic} />{teacherSolution && <div className="my-5 rounded-3xl border-2 border-fuchsia-300 bg-fuchsia-50 p-4 text-fuchsia-950"><div className="font-black">Lehrer-Lösung</div><div className="mt-1 text-sm leading-relaxed">{solutionText}</div>{task.workedExample && <pre className="mt-3 overflow-x-auto rounded-2xl bg-slate-950 p-3 font-mono text-xs font-bold leading-relaxed text-sky-100">{task.workedExample}</pre>}</div>}<HintBox task={task} hintsVisible={hintsVisible} /><FeedbackBox feedback={feedback} onNext={() => onDone(task.xp || 0)} />
        {["single", "error", "mini"].includes(task.kind) && <div className="mt-5 grid gap-3">{shuffledOptions.map(option => <button key={option} onClick={() => setSingle(option)} className={`rounded-2xl border p-4 text-left font-bold transition ${single === option ? "border-sky-500 bg-sky-50 ring-4 ring-sky-100" : "border-slate-200 bg-white hover:bg-slate-50"}`}>{option}</button>)}</div>}
        {task.kind === "multiple" && <div className="mt-5 grid gap-3">{shuffledOptions.map(option => <button key={option} onClick={() => toggleMulti(option)} className={`rounded-2xl border p-4 text-left font-bold transition ${multi.includes(option) ? "border-emerald-500 bg-emerald-50 ring-4 ring-emerald-100" : "border-slate-200 bg-white hover:bg-slate-50"}`}>{multi.includes(option) ? "☑" : "☐"} {option}</button>)}</div>}
        {task.kind === "input" && <div className="mt-5"><input value={text} onChange={event => setText(event.target.value)} onKeyDown={event => { if (event.key === "Enter") evaluate(); }} placeholder={task.placeholder || "Antwort eingeben"} className="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-lg font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" /><p className="mt-2 text-xs font-semibold text-slate-500">Mögliche Schreibweisen: <span className="font-mono">x=...; y=...</span>, <span className="font-mono">(...;...)</span>, <span className="font-mono">...|...</span> oder Werte in richtiger Reihenfolge.</p></div>}
        {task.kind === "cloze" && <div className="mt-5 rounded-3xl bg-slate-50 p-4 text-lg font-bold leading-loose">{task.clozeText.map((part, index) => typeof part === "string" ? <React.Fragment key={index}>{part}</React.Fragment> : <input key={part.id} value={cloze[part.id] || ""} onChange={event => setCloze(old => ({ ...old, [part.id]: event.target.value }))} className="mx-1 inline-block rounded-xl border border-slate-300 px-3 py-2 text-center font-mono outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" style={{ width: `${Math.max(56, (part.size || 4) * 14)}px` }} />)}</div>}
        {task.kind === "matching" && <div className="mt-5 space-y-4">{task.items.map(item => <div key={item.id} className="rounded-3xl border border-slate-200 bg-slate-50 p-4"><div className="font-black">{item.left}</div><div className="mt-3 flex flex-wrap gap-2">{shuffledChoices.map(choice => <button key={choice} onClick={() => setMatches(old => ({ ...old, [item.id]: choice }))} className={`rounded-2xl px-3 py-2 text-sm font-black transition ${matches[item.id] === choice ? "bg-slate-900 text-white" : "bg-white text-slate-700 hover:bg-slate-100"}`}>{choice}</button>)}</div></div>)}</div>}
        {["sort", "reorder"].includes(task.kind) && <div className="mt-5 grid gap-4 lg:grid-cols-2"><div className="rounded-3xl bg-slate-50 p-4"><div className="mb-3 font-black">Verfügbare Schritte</div><div className="flex flex-wrap gap-2">{shuffledItems.filter(item => !order.includes(item)).map(item => <button key={item} onClick={() => addOrder(item)} className="rounded-2xl bg-white px-3 py-2 text-left text-sm font-bold text-slate-800 shadow-sm hover:bg-sky-50">{item}</button>)}</div></div><div className="rounded-3xl bg-slate-900 p-4 text-white"><div className="mb-3 flex items-center justify-between"><div className="font-black">Deine Reihenfolge</div><button onClick={() => setOrder([])} className="text-xs font-black text-sky-200 hover:text-white">zurücksetzen</button></div><ol className="space-y-2">{order.map((item, index) => <li key={item} className="rounded-2xl bg-white/10 p-3 text-sm font-bold">{index + 1}. {item}</li>)}{order.length === 0 && <li className="text-sm text-slate-400">Noch kein Schritt ausgewählt.</li>}</ol></div></div>}
        {task.kind === "dragdrop" && <div className="mt-5 grid gap-4 lg:grid-cols-[.9fr_1.1fr]"><div className="rounded-3xl bg-slate-50 p-4"><div className="mb-3 font-black">Karten</div><div className="space-y-2">{shuffledCards.map(card => <button key={card.id} onClick={() => setSelectedCard(card.id)} className={`w-full rounded-2xl border p-3 text-left text-sm font-bold transition ${selectedCard === card.id ? "border-sky-500 bg-sky-50 ring-4 ring-sky-100" : dragState[card.id] ? "border-emerald-200 bg-emerald-50" : "border-slate-200 bg-white hover:bg-slate-100"}`}>{card.text}{dragState[card.id] && <div className="mt-1 text-xs text-emerald-700">→ {dragState[card.id]}</div>}</button>)}</div></div><div className="grid gap-3 sm:grid-cols-2">{task.bins.map(bin => <div key={bin} onClick={() => selectedCard && setCardBin(selectedCard, bin)} className="min-h-[190px] rounded-3xl border-2 border-dashed border-slate-300 bg-slate-50 p-4"><div className="mb-3 font-black">{bin}</div><div className="space-y-2">{task.cards.filter(card => dragState[card.id] === bin).map(card => <div key={card.id} className="rounded-2xl bg-white p-3 text-sm font-bold shadow-sm">{card.text}</div>)}</div></div>)}</div></div>}
        {task.kind === "hotspot" && <HotspotChart task={task} value={hotspot} onChange={setHotspot} />}
        <div className="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"><div className="flex flex-wrap gap-2">{hasMoreHints && !feedback?.ok && <Button variant="light" onClick={revealHint}>{hintsVisible === 0 ? "Tipp anzeigen" : "Weitere Hilfe anzeigen"}</Button>}</div>{!feedback?.ok && <Button variant="dark" onClick={evaluate}>Antwort prüfen</Button>}</div>
      </section>;
    }

    function LevelView({ level, stepIndex, setStepIndex, profile, updateProgress, onBack, onFinished, teacherSolution }) {
      const realStepIndex = stepIndex - 1;
      const step = realStepIndex >= 0 ? level.steps[realStepIndex] : null;
      useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [level.id, stepIndex]);
      function completeStep(xp = 0, skipped = false) {
        const current = step;
        updateProgress(old => {
          const earned = new Set(old.earnedTasks || []);
          let addXp = 0;
          if (!skipped && current?.type === "task" && current.id && !earned.has(current.id)) { earned.add(current.id); addXp = xp; }
          const next = { ...old, xp: old.xp + addXp, earnedTasks: Array.from(earned) };
          if (realStepIndex >= level.steps.length - 1) { next.completed = Array.from(new Set([...(old.completed || []), level.id])); next.unlocked = Math.max(old.unlocked, level.id + 1); }
          return next;
        });
        if (realStepIndex < level.steps.length - 1) setStepIndex(stepIndex + 1); else onFinished();
      }
      return <main className="mx-auto max-w-5xl px-4 py-6 sm:px-5"><div className="mb-5 flex flex-col gap-4 rounded-[2rem] border border-white/10 bg-white/10 p-4 backdrop-blur md:flex-row md:items-center md:justify-between"><div className="flex items-center gap-4"><button onClick={onBack} className="grid h-11 w-11 place-items-center rounded-2xl bg-white/10 font-black hover:bg-white/20">←</button><div><div className="text-sm font-bold text-slate-300">Level {level.id} · {stepIndex === 0 ? "Erklärung" : `Station ${realStepIndex + 1}/${level.steps.length}`}</div><h1 className="text-2xl font-black">{level.icon} {level.title}</h1></div></div><div className="h-3 overflow-hidden rounded-full bg-white/10 md:w-64"><div className={`h-full rounded-full bg-gradient-to-r ${level.color}`} style={{ width: `${((stepIndex + 1) / (level.steps.length + 1)) * 100}%` }} /></div></div>{stepIndex === 0 && <MethodIntro level={level} onNext={() => setStepIndex(1)} />}{step?.type === "info" && <InfoCard step={step} onNext={() => completeStep(0)} />}{step?.type === "worksheet" && <WorksheetPhase step={step} onNext={() => completeStep(0)} />}{step?.type === "task" && <TaskRenderer task={step} support={profile.support} teacherSolution={teacherSolution} onDone={xp => completeStep(xp)} />}</main>;
    }

    function BossGame({ progress, updateProgress, onMenu, onCertificate }) {
      const [active, setActive] = useState(false);
      const [time, setTime] = useState(60);
      const [questions, setQuestions] = useState([]);
      const [idx, setIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [chosen, setChosen] = useState("");
      const [input, setInput] = useState("");
      const [answers, setAnswers] = useState([]);
      const [finished, setFinished] = useState(false);
      const current = questions[idx];
      const shuffledBossOptions = useMemo(() => current?.options ? shuffleArray(current.options) : [], [current?.q]);
      function start() { setQuestions(shuffleArray(bossQuestions)); setIdx(0); setScore(0); setChosen(""); setInput(""); setAnswers([]); setTime(60); setFinished(false); setActive(true); }
      function finish(finalScore = score) { setFinished(true); setActive(false); updateProgress(old => ({ ...old, bossBest: Math.max(old.bossBest || 0, finalScore), certificateUnlocked: true, xp: old.xp + Math.max(0, finalScore * 5) })); }
      useEffect(() => { if (!active || finished) return; if (time <= 0) { finish(score); return; } const timer = setTimeout(() => setTime(value => value - 1), 1000); return () => clearTimeout(timer); }, [active, finished, time, score]);
      function submit() {
        const question = questions[idx];
        if (!question) return finish(score);
        const ok = question.kind === "single" ? chosen === question.answer : checkSolution(input, question.solution);
        const newScore = ok ? score + 1 : score;
        const record = { q: question.q, ok, user: question.kind === "single" ? chosen : input, solution: question.kind === "single" ? question.answer : Object.entries(question.solution.vars).map(([k, v]) => `${k}=${v}`).join("; "), explanation: question.explanation };
        setAnswers(old => [...old, record]);
        setScore(newScore);
        if (idx >= questions.length - 1) setTimeout(() => finish(newScore), 80);
        else { setIdx(value => value + 1); setChosen(""); setInput(""); }
      }
      if (!active && !finished) return <main className="mx-auto grid min-h-[calc(100vh-80px)] max-w-5xl place-items-center px-4 py-8"><section className="glass rounded-[2rem] p-6 text-center shadow-2xl sm:p-10"><div className="mx-auto grid h-24 w-24 place-items-center rounded-[2rem] bg-gradient-to-br from-yellow-300 to-orange-400 text-5xl shadow-glow">🏁</div><h1 className="mt-6 text-4xl font-black">Boss-Level: Additio-Core</h1><p className="mx-auto mt-4 max-w-2xl text-lg leading-relaxed text-slate-200">Du hast 60 Sekunden. Löse so viele Aufgaben wie möglich.</p><div className="mt-7 flex flex-col justify-center gap-3 sm:flex-row"><Button onClick={start} className="text-lg">Finale starten</Button><Button variant="secondary" onClick={onMenu}>Zurück zum Menü</Button></div></section></main>;
      if (finished) return <main className="mx-auto max-w-5xl px-4 py-8"><section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-8"><div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between"><div><div className="text-5xl">🎉</div><h1 className="mt-3 text-3xl font-black">Boss-Level beendet</h1><p className="mt-2 text-slate-600">Score: <span className="font-black text-slate-950">{score}</span> von {answers.length}</p></div><div className="rounded-[2rem] bg-slate-900 p-5 text-center text-white"><div className="text-sm text-slate-300">Bestleistung</div><div className="text-4xl font-black">{Math.max(progress.bossBest || 0, score)}</div></div></div><div className="mt-6 grid gap-4">{answers.map((answer, index) => <div key={index} className={`rounded-3xl border p-4 ${answer.ok ? "border-emerald-200 bg-emerald-50" : "border-rose-200 bg-rose-50"}`}><div className="font-black">{answer.ok ? "✅" : "❌"} {answer.q}</div><div className="mt-1 text-sm text-slate-700">Deine Antwort: <span className="font-bold">{answer.user || "—"}</span></div>{!answer.ok && <div className="mt-1 text-sm text-slate-700">Richtige Lösung: <span className="font-bold">{answer.solution}</span></div>}<div className="mt-2 text-sm text-slate-600">{answer.explanation}</div></div>)}</div><div className="mt-7 flex flex-col gap-3 sm:flex-row sm:justify-end"><Button variant="light" onClick={start}>Erneut versuchen</Button><Button variant="dark" onClick={onCertificate}>Zertifikat anzeigen</Button></div></section></main>;
      return <main className="mx-auto max-w-4xl px-4 py-8"><section className="soft rounded-[2rem] p-5 shadow-2xl sm:p-8"><div className="mb-5 flex items-center justify-between gap-4"><div><div className="text-sm font-black text-slate-500">Boss-Frage {idx + 1}/{questions.length}</div><div className="text-2xl font-black">Score: {score}</div></div><div className={`grid h-20 w-20 place-items-center rounded-[2rem] text-3xl font-black text-white ${time <= 10 ? "bg-rose-500" : "bg-slate-900"}`}>{time}</div></div><div className="rounded-3xl bg-slate-950 p-5 text-xl font-black leading-relaxed text-white">{current?.q}</div>{current?.kind === "single" && <div className="mt-5 grid gap-3">{shuffledBossOptions.map(option => <button key={option} onClick={() => setChosen(option)} className={`rounded-2xl border p-4 text-left font-bold transition ${chosen === option ? "border-sky-500 bg-sky-50 ring-4 ring-sky-100" : "border-slate-200 bg-white hover:bg-slate-50"}`}>{option}</button>)}</div>}{current?.kind === "input" && <input value={input} onChange={event => setInput(event.target.value)} onKeyDown={event => { if (event.key === "Enter") submit(); }} placeholder="Lösung eingeben" className="mt-5 w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-lg font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" />}<div className="mt-6 flex justify-end"><Button variant="dark" onClick={submit}>Einloggen ⚡</Button></div></section></main>;
    }

    function Certificate({ profile, progress, onMenu }) {
      const date = new Date().toLocaleDateString("de-DE");
      return <main className="mx-auto max-w-5xl px-4 py-8"><section className="overflow-hidden rounded-[2rem] bg-white text-slate-950 shadow-2xl"><div className="bg-gradient-to-r from-sky-500 via-violet-500 to-emerald-400 p-2"/><div className="p-6 text-center sm:p-10"><div className="mx-auto grid h-24 w-24 place-items-center rounded-[2rem] bg-gradient-to-br from-yellow-300 to-amber-400 text-5xl shadow-xl">🏆</div><div className="mt-6 text-sm font-black uppercase tracking-[.35em] text-slate-500">Zertifikat</div><h1 className="mt-3 text-4xl font-black sm:text-5xl">Mission Additio bestanden</h1><p className="mx-auto mt-6 max-w-2xl text-lg leading-relaxed text-slate-700">Dieses Zertifikat bestätigt, dass</p><div className="mx-auto mt-4 max-w-2xl rounded-[2rem] border-4 border-slate-900 bg-slate-50 p-6"><div className="text-5xl">{profile.avatar}</div><div className="mt-3 text-4xl font-black">{profile.name}</div></div><p className="mx-auto mt-6 max-w-3xl text-lg leading-relaxed text-slate-700">den digitalen Lernpfad zum <span className="font-black text-slate-950">Additionsverfahren zum Lösen linearer Gleichungssysteme</span> erfolgreich bearbeitet hat.</p><div className="mt-8 grid gap-4 sm:grid-cols-3"><div className="rounded-3xl bg-slate-100 p-5"><div className="text-sm font-black text-slate-500">Level</div><div className="text-3xl font-black">{progress.completed.length}/10</div></div><div className="rounded-3xl bg-slate-100 p-5"><div className="text-sm font-black text-slate-500">XP</div><div className="text-3xl font-black">{progress.xp}</div></div><div className="rounded-3xl bg-slate-100 p-5"><div className="text-sm font-black text-slate-500">Datum</div><div className="text-3xl font-black">{date}</div></div></div><div className="no-print mt-8 flex flex-col justify-center gap-3 sm:flex-row"><Button variant="dark" onClick={() => window.print()}>Zertifikat drucken</Button><Button variant="light" onClick={onMenu}>Zurück zum Menü</Button></div></div></section></main>;
    }

    function TeacherMenu({ open, onClose, onUnlockAll, onSkip, onShowSolution }) {
      const [password, setPassword] = useState("");
      const [authed, setAuthed] = useState(false);
      const [error, setError] = useState("");
      useEffect(() => { if (!open) { setPassword(""); setError(""); } }, [open]);
      if (!open) return null;
      function login() {
        if (password.trim() === TEACHER_PASSWORD) { setAuthed(true); setError(""); }
        else setError("Passwort nicht korrekt.");
      }
      return <div className="fixed inset-0 z-50 grid place-items-center bg-slate-950/70 p-4 backdrop-blur"><div className="w-full max-w-md rounded-[2rem] bg-white p-5 text-slate-950 shadow-2xl"><div className="flex items-center justify-between gap-3"><h2 className="text-2xl font-black">Lehrer-Menü</h2><button onClick={onClose} className="rounded-xl bg-slate-100 px-3 py-2 font-black hover:bg-slate-200">×</button></div>{!authed ? <div className="mt-5"><p className="text-sm text-slate-600">Verstecktes Lehrer-Menü. Passwort eingeben.</p><input type="password" value={password} onChange={event => setPassword(event.target.value)} onKeyDown={event => { if (event.key === "Enter") login(); }} className="mt-3 w-full rounded-2xl border border-slate-300 px-4 py-3 font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100" placeholder="Passwort" />{error && <div className="mt-2 text-sm font-bold text-rose-600">{error}</div>}<Button variant="dark" onClick={login} className="mt-4 w-full">Einloggen</Button></div> : <div className="mt-5 grid gap-3"><Button variant="dark" onClick={onUnlockAll}>Alle Level freischalten</Button><Button variant="light" onClick={onSkip}>Aktuelle Aufgabe überspringen</Button><Button variant="light" onClick={onShowSolution}>Lösung der aktuellen Aufgabe einblenden</Button></div>}</div></div>;
    }

    function App() {
      const initial = useMemo(() => loadState() || { profile: null, progress: { unlocked: 1, completed: [], xp: 0, earnedTasks: [], bossBest: 0, certificateUnlocked: false } }, []);
      const [profile, setProfile] = useState(initial.profile);
      const [progress, setProgress] = useState(initial.progress);
      const [view, setView] = useState(initial.profile ? "menu" : "welcome");
      const [currentLevelId, setCurrentLevelId] = useState(1);
      const [stepIndex, setStepIndex] = useState(0);
      const [teacherOpen, setTeacherOpen] = useState(false);
      const [teacherSolution, setTeacherSolution] = useState(false);

      useEffect(() => saveState({ profile, progress }), [profile, progress]);
      useEffect(() => {
        function key(event) { if (event.ctrlKey && event.altKey && event.key.toLowerCase() === "l") setTeacherOpen(true); }
        window.addEventListener("keydown", key);
        return () => window.removeEventListener("keydown", key);
      }, []);

      function updateProgress(fn) { setProgress(old => typeof fn === "function" ? fn(old) : fn); }
      function startProfile(newProfile) { setProfile(newProfile); setProgress({ unlocked: 1, completed: [], xp: 0, earnedTasks: [], bossBest: 0, certificateUnlocked: false }); setView("menu"); }
      function startLevel(id) { setCurrentLevelId(id); setStepIndex(0); setTeacherSolution(false); setView("level"); }
      function skipCurrent() {
        if (view !== "level") return;
        const level = LEVELS.find(item => item.id === currentLevelId);
        if (!level) return;
        if (stepIndex < level.steps.length) setStepIndex(stepIndex + 1);
        else {
          setProgress(old => ({ ...old, completed: Array.from(new Set([...(old.completed || []), level.id])), unlocked: Math.max(old.unlocked, level.id + 1) }));
          setView("menu");
        }
        setTeacherSolution(false);
      }

      const currentLevel = LEVELS.find(level => level.id === currentLevelId);
      if (view === "welcome") return <Welcome onStart={startProfile} />;
      return <><Header profile={profile} progress={progress} onMenu={() => setView("menu")} onTeacher={() => setTeacherOpen(true)} />{view === "menu" && <MainMenu profile={profile} progress={progress} onStartLevel={startLevel} onBoss={() => setView("boss")} onResetProfile={() => setView("welcome")} />}{view === "level" && currentLevel && <LevelView level={currentLevel} stepIndex={stepIndex} setStepIndex={index => { setTeacherSolution(false); setStepIndex(index); }} profile={profile} updateProgress={updateProgress} teacherSolution={teacherSolution} onBack={() => setView("menu")} onFinished={() => { setTeacherSolution(false); setView("menu"); }} />}{view === "boss" && <BossGame progress={progress} updateProgress={updateProgress} onMenu={() => setView("menu")} onCertificate={() => setView("certificate")} />}{view === "certificate" && <Certificate profile={profile} progress={progress} onMenu={() => setView("menu")} />}<TeacherMenu open={teacherOpen} onClose={() => setTeacherOpen(false)} onUnlockAll={() => setProgress(old => ({ ...old, unlocked: 11, completed: LEVELS.map(level => level.id), certificateUnlocked: true }))} onSkip={skipCurrent} onShowSolution={() => setTeacherSolution(true)} /></>;
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
