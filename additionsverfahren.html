    function safeLoad() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function safeSave(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch {}
    }

    function norm(value) {
      return String(value ?? "")
        .toLowerCase()
        .trim()
        .replace(/−/g, "-")
        .replace(/\s+/g, "")
        .replace(/,/g, ".")
        .replace(/[{}]/g, "")
        .replace(/lösung[:=]?/g, "")
        .replace(/l[:=]?/g, "")
        .replace(/[()]/g, "")
        .replace(/\|/g, ";");
    }

    function sameSet(a, b) {
      return a.length === b.length && a.every(x => b.includes(x));
    }

    function sameOrder(a, b) {
      return a.length === b.length && a.every((x, i) => x === b[i]);
    }

    function formatParts(text) {
      const parts = String(text).split(/(\*\*.*?\*\*|\$.*?\$)/g);
      return parts.map((part, i) => {
        if (part.startsWith("**") && part.endsWith("**")) {
          return <span key={i} className="font-black text-sky-700">{part.slice(2, -2)}</span>;
        }
        if (part.startsWith("$") && part.endsWith("$")) {
          return <span key={i} className="mx-1 rounded-lg bg-slate-100 px-2 py-0.5 font-mono text-slate-900">{part.slice(1, -1)}</span>;
        }
        return <React.Fragment key={i}>{part}</React.Fragment>;
      });
    }

    function getInitialState() {
      return safeLoad() || {
        profile: null,
        progress: {
          unlocked: 1,
          completed: [],
          xp: 0,
          earnedTasks: [],
          bossBest: 0,
          certificateUnlocked: false
        }
      };
    }

    function Button({ children, onClick, variant = "primary", disabled = false, className = "", type = "button" }) {
      const variants = {
        primary: "bg-gradient-to-r from-sky-500 to-cyan-400 text-white shadow-lg shadow-sky-900/20 hover:brightness-110",
        secondary: "bg-white/10 text-white border border-white/20 hover:bg-white/20",
        dark: "bg-slate-900 text-white hover:bg-slate-800",
        light: "bg-white text-slate-900 border border-slate-200 hover:bg-slate-50",
        success: "bg-gradient-to-r from-emerald-500 to-lime-400 text-white hover:brightness-110",
        danger: "bg-gradient-to-r from-rose-500 to-red-500 text-white hover:brightness-110",
        ghost: "text-slate-700 hover:bg-slate-100"
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`rounded-2xl px-4 py-3 font-bold transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50 ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, tone = "sky" }) {
      const tones = {

    function TaskRenderer({ task, support, teacherSolution, onDone }) {
      const [attempts, setAttempts] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [single, setSingle] = useState("");
      const [multi, setMulti] = useState([]);
      const [text, setText] = useState("");
      const [cloze, setCloze] = useState({});
      const [matches, setMatches] = useState({});
      const [order, setOrder] = useState([]);
      const [dragState, setDragState] = useState({});
      const [selectedCard, setSelectedCard] = useState(null);
      const [hotspot, setHotspot] = useState("");
      const [showExtraHint, setShowExtraHint] = useState(false);

      useEffect(() => {
        setAttempts(0);
        setFeedback(null);
        setSingle("");
        setMulti([]);
        setText("");
        setCloze({});
        setMatches({});
        setOrder([]);
        setDragState({});
        setSelectedCard(null);
        setHotspot("");
        setShowExtraHint(false);
      }, [task.id]);

      const hintIndex = Math.min(Math.max(0, attempts), (task.hints || []).length - 1);
      const currentHint = task.hints?.[hintIndex];

      function toggleMulti(option) {
        setMulti(old => old.includes(option) ? old.filter(x => x !== option) : [...old, option]);
      }

      function addOrder(item) {
        if (!order.includes(item)) setOrder([...order, item]);
      }

      function resetOrder() {
        setOrder([]);
      }

      function setCardBin(cardId, bin) {
        setDragState(old => ({ ...old, [cardId]: bin }));
        setSelectedCard(null);
      }

      function evaluate() {
        let ok = false;

        if (["single", "error", "mini"].includes(task.kind)) {
          ok = single === task.answer;
        }

        if (task.kind === "multiple") {
          ok = sameSet(multi, task.answer);
        }

        if (task.kind === "input") {
          ok = (task.accepted || []).map(norm).includes(norm(text));
        }

        if (task.kind === "cloze") {
          ok = Object.entries(task.answers).every(([id, accepted]) =>
            accepted.map(norm).includes(norm(cloze[id] ?? ""))
          );
        }

        if (task.kind === "matching") {
          ok = task.items.every(item => matches[item.id] === task.answer[item.id]);
        }

        if (["sort", "reorder"].includes(task.kind)) {
          ok = sameOrder(order, task.answer);
        }

        if (task.kind === "dragdrop") {
          ok = task.cards.every(card => dragState[card.id] === task.answer[card.id]);
        }

        if (task.kind === "hotspot") {
          ok = hotspot === task.answer;
        }

        if (ok) {
          setFeedback({
            ok: true,
            title: "Richtig gelöst!",
            message: task.explanation || "Sehr gut. Du hast den nächsten Schritt sicher erkannt."
          });
        } else {
          const nextAttempts = attempts + 1;
          setAttempts(nextAttempts);
          const adaptiveHint = task.hints?.[Math.min(nextAttempts - 1, task.hints.length - 1)] || "Prüfe deine Rechnung Schritt für Schritt.";
          setFeedback({
            ok: false,
            title: nextAttempts >= 3 ? "Fast geschafft – jetzt konkret:" : "Noch nicht ganz.",
            message: adaptiveHint
          });
        }
      }

      function answerText() {
        if (task.solution) return task.solution;
        if (task.kind === "single") return `Richtig ist: ${task.answer}`;
        if (task.kind === "multiple") return `Richtig sind: ${task.answer.join(", ")}`;
        if (task.kind === "input") return `Eine richtige Eingabe wäre: ${task.accepted?.[0]}`;
        return "Nutze die Hinweise und prüfe den Lösungsweg Schritt für Schritt.";
      }

    function LevelView({ level, stepIndex, setStepIndex, profile, progress, updateProgress, onBack, onFinished, teacherSolution }) {
      const step = level.steps[stepIndex];

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, [level.id, stepIndex]);

      function completeStep(xp = 0, skipped = false) {
        const current = level.steps[stepIndex];
        updateProgress(old => {
          const earned = new Set(old.earnedTasks || []);
          let addXp = 0;
          if (!skipped && current.type === "task" && current.id && !earned.has(current.id)) {
            earned.add(current.id);
            addXp = xp;
          }

          const next = {
            ...old,
            xp: old.xp + addXp,
            earnedTasks: Array.from(earned)
          };

          if (stepIndex >= level.steps.length - 1) {
            next.completed = Array.from(new Set([...(old.completed || []), level.id]));
            next.unlocked = Math.max(old.unlocked, level.id + 1);
          }

          return next;
        });

        if (stepIndex < level.steps.length - 1) {
          setStepIndex(stepIndex + 1);
        } else {
          onFinished();
        }
      }

      return (
        <main className="mx-auto max-w-5xl px-4 py-6 sm:px-5">
          <div className="mb-5 flex flex-col gap-4 rounded-[2rem] border border-white/10 bg-white/10 p-4 backdrop-blur md:flex-row md:items-center md:justify-between">
            <div className="flex items-center gap-4">
              <button onClick={onBack} className="grid h-11 w-11 place-items-center rounded-2xl bg-white/10 font-black hover:bg-white/20">←</button>
              <div>
                <div className="text-sm font-bold text-slate-300">Level {level.id} · Station {stepIndex + 1}/{level.steps.length}</div>
                <h1 className="text-2xl font-black">{level.icon} {level.title}</h1>
              </div>
            </div>
            <div className="h-3 overflow-hidden rounded-full bg-white/10 md:w-64">
              <div className={`h-full rounded-full bg-gradient-to-r ${level.color} transition-all`} style={{ width: `${((stepIndex + 1) / level.steps.length) * 100}%` }} />
            </div>
          </div>

          {step.type === "info" && <InfoCard step={step} onNext={() => completeStep(0)} />}
          {step.type === "worksheet" && <WorksheetPhase step={step} onNext={() => completeStep(0)} />}
          {step.type === "task" && (
            <TaskRenderer
              task={step}
              support={profile.support}
              teacherSolution={teacherSolution}
              onDone={(xp) => completeStep(xp)}
            />
          )}
        </main>
      );
    }

    function BossGame({ profile, progress, updateProgress, onMenu, onCertificate }) {
      const [active, setActive] = useState(false);
      const [time, setTime] = useState(60);
      const [questions, setQuestions] = useState([]);
      const [idx, setIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [chosen, setChosen] = useState("");
      const [input, setInput] = useState("");
      const [answers, setAnswers] = useState([]);
      const [finished, setFinished] = useState(false);

      function shuffle(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
      }

      function start() {
        setQuestions(shuffle(bossQuestions));
        setIdx(0);
        setScore(0);
        setChosen("");
        setInput("");
        setAnswers([]);
        setTime(60);
        setFinished(false);
        setActive(true);
      }

      useEffect(() => {
        if (!active || finished) return;
        if (time <= 0) {
          finish();
          return;
        }
        const t = setTimeout(() => setTime(v => v - 1), 1000);
        return () => clearTimeout(t);
      }, [active, finished, time]);

      function finish() {
        setFinished(true);
        setActive(false);
        updateProgress(old => ({
          ...old,
          bossBest: Math.max(old.bossBest || 0, score),
          certificateUnlocked: true,
          xp: old.xp + Math.max(0, score * 5)
        }));
      }

      function submit() {
        const q = questions[idx];
        if (!q) return finish();
        let ok = false;

        if (q.kind === "single") ok = chosen === q.answer;
        if (q.kind === "input") ok = (q.accepted || []).map(norm).includes(norm(input));

        const record = {
          q: q.q,
          ok,
          user: q.kind === "single" ? chosen : input,
          solution: q.kind === "single" ? q.answer : q.accepted?.[0],
          explanation: q.explanation
        };

        setAnswers(old => [...old, record]);
        if (ok) setScore(s => s + 1);

        if (idx >= questions.length - 1) {
          setTimeout(() => finish(), 50);
        } else {
          setIdx(i => i + 1);
          setChosen("");
          setInput("");
        }
      }

      const current = questions[idx];

      if (!active && !finished) {
        return (
          <main className="mx-auto grid min-h-[calc(100vh-80px)] max-w-5xl place-items-center px-4 py-8">
            <section className="glass rounded-[2rem] p-6 text-center shadow-2xl sm:p-10">
              <div className="mx-auto grid h-24 w-24 place-items-center rounded-[2rem] bg-gradient-to-br from-yellow-300 to-orange-400 text-5xl shadow-glow">🏁</div>
              <h1 className="mt-6 text-4xl font-black">Boss-Level: Additio-Core</h1>
              <p className="mx-auto mt-4 max-w-2xl text-lg leading-relaxed text-slate-200">
                Du hast 60 Sekunden. Löse so viele Aufgaben wie möglich. Jede richtige Antwort stabilisiert den Gleichungs-Kern.
              </p>
              <div className="mt-7 flex flex-col justify-center gap-3 sm:flex-row">
                <Button onClick={start} className="text-lg">Finale starten</Button>
                <Button variant="secondary" onClick={onMenu}>Zurück zum Menü</Button>
              </div>
            </section>
          </main>
        );
      }

      if (finished) {
        const wrong = answers.filter(a => !a.ok);
        const right = answers.filter(a => a.ok);
        return (
          <main className="mx-auto max-w-5xl px-4 py-8">
            <section className="soft-card rounded-[2rem] p-5 shadow-2xl sm:p-8">
              <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                  <div className="text-5xl">🎉</div>
                  <h1 className="mt-3 text-3xl font-black">Boss-Level beendet</h1>
                  <p className="mt-2 text-slate-600">Score: <span className="font-black text-slate-950">{score}</span> von {answers.length}</p>
                </div>
                <div className="rounded-[2rem] bg-slate-900 p-5 text-center text-white">
                  <div className="text-sm text-slate-300">Bestleistung</div>
                  <div className="text-4xl font-black">{Math.max(progress.bossBest || 0, score)}</div>
                </div>
              </div>

              <div className="mt-6 grid gap-4">
                {[...wrong, ...right].map((a, i) => (
                  <div key={i} className={`rounded-3xl border p-4 ${a.ok ? "border-emerald-200 bg-emerald-50" : "border-rose-200 bg-rose-50"}`}>
                    <div className="font-black">{a.ok ? "✅" : "❌"} {a.q}</div>
                    <div className="mt-1 text-sm text-slate-700">Deine Antwort: <span className="font-bold">{a.user || "—"}</span></div>
                    {!a.ok && <div className="mt-1 text-sm text-slate-700">Richtige Lösung: <span className="font-bold">{a.solution}</span></div>}
                    <div className="mt-2 text-sm text-slate-600">{a.explanation}</div>
                  </div>
                ))}
              </div>

              <div className="mt-7 flex flex-col gap-3 sm:flex-row sm:justify-end">
                <Button variant="light" onClick={start}>Erneut versuchen</Button>
                <Button variant="dark" onClick={onCertificate}>Zertifikat anzeigen</Button>
              </div>
            </section>
          </main>
        );
      }

      return (
        <main className="mx-auto max-w-4xl px-4 py-8">
          <section className="soft-card rounded-[2rem] p-5 shadow-2xl sm:p-8">
            <div className="mb-5 flex items-center justify-between gap-4">
              <div>
                <div className="text-sm font-black text-slate-500">Boss-Frage {idx + 1}/{questions.length}</div>
                <div className="text-2xl font-black">Score: {score}</div>
              </div>
              <div className={`grid h-20 w-20 place-items-center rounded-[2rem] text-3xl font-black text-white ${time <= 10 ? "bg-rose-500" : "bg-slate-900"}`}>
                {time}
              </div>
            </div>

            <div className="rounded-3xl bg-slate-950 p-5 text-xl font-black leading-relaxed text-white">
              {current?.q}
            </div>

            {current?.kind === "single" && (
              <div className="mt-5 grid gap-3">
                {current.options.map(option => (
                  <button
                    key={option}
                    onClick={() => setChosen(option)}
                    className={`rounded-2xl border p-4 text-left font-bold transition ${
                      chosen === option ? "border-sky-500 bg-sky-50 ring-4 ring-sky-100" : "border-slate-200 bg-white hover:bg-slate-50"
                    }`}
                  >
                    {option}
                  </button>
                ))}
              </div>
            )}

            {current?.kind === "input" && (
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") submit(); }}
                placeholder="Antwort eingeben"
                className="mt-5 w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-lg font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100"
              />
            )}

            <div className="mt-6 flex justify-end">
              <Button variant="dark" onClick={submit}>Einloggen ⚡</Button>
            </div>
          </section>
        </main>
      );
    }

    function TeacherMenu({ open, onClose, onUnlockAll, onSkip, onShowSolution }) {
      const [password, setPassword] = useState("");

      useEffect(() => {
        if (!open) {
          setPassword("");
          setError("");
        }
      }, [open]);

      if (!open) return null;

      function login() {
        if (password === "bor2026" || password === "bor") {
          setAuthed(true);
          setError("");
        } else {
          setError("Passwort nicht korrekt.");
        }
      }

      return (
        <div className="fixed inset-0 z-50 grid place-items-center bg-slate-950/70 p-4 backdrop-blur">
          <div className="w-full max-w-md rounded-[2rem] bg-white p-5 text-slate-950 shadow-2xl">
            <div className="flex items-center justify-between gap-3">
              <h2 className="text-2xl font-black">Lehrer-Menü</h2>
              <button onClick={onClose} className="rounded-xl bg-slate-100 px-3 py-2 font-black hover:bg-slate-200">×</button>
            </div>

            {!authed ? (
              <div className="mt-5">
                <p className="text-sm text-slate-600">Passwort eingeben, um Zusatzfunktionen freizuschalten.</p>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") login(); }}
                  className="mt-3 w-full rounded-2xl border border-slate-300 px-4 py-3 font-bold outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100"
                  placeholder="Passwort"
                />
                {error && <div className="mt-2 text-sm font-bold text-rose-600">{error}</div>}
                <Button variant="dark" onClick={login} className="mt-4 w-full">Einloggen</Button>
              </div>
            ) : (
              <div className="mt-5 grid gap-3">
                <Button variant="dark" onClick={onUnlockAll}>Alle Level freischalten</Button>
                <Button variant="light" onClick={onSkip}>Aktuelle Station überspringen</Button>
                <Button variant="light" onClick={onShowSolution}>Lösung der aktuellen Aufgabe einblenden</Button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const initial = useMemo(getInitialState, []);
      const [profile, setProfile] = useState(initial.profile);
      const [progress, setProgress] = useState(initial.progress);
      const [view, setView] = useState(initial.profile ? "menu" : "welcome");
      const [currentLevelId, setCurrentLevelId] = useState(1);
      const [stepIndex, setStepIndex] = useState(0);
      const [teacherOpen, setTeacherOpen] = useState(false);
      const [teacherSolution, setTeacherSolution] = useState(false);

      useEffect(() => {
        safeSave({ profile, progress });
      }, [profile, progress]);

      useEffect(() => {
        function key(e) {
          if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "l") setTeacherOpen(true);
        }
        window.addEventListener("keydown", key);
        return () => window.removeEventListener("keydown", key);
      }, []);

      function updateProgress(fn) {
        setProgress(old => typeof fn === "function" ? fn(old) : fn);
      }

      function startProfile(newProfile) {
        setProfile(newProfile);
        setProgress({
          unlocked: 1,
          completed: [],
          xp: 0,
          earnedTasks: [],
          bossBest: 0,
          certificateUnlocked: false
        });
        setView("menu");
      }

      function startLevel(id) {
        setCurrentLevelId(id);
        setStepIndex(0);
        setTeacherSolution(false);
        setView("level");
      }

      function skipCurrent() {
        if (view !== "level") return;
        const level = LEVELS.find(l => l.id === currentLevelId);
        if (!level) return;
        if (stepIndex < level.steps.length - 1) {
          setStepIndex(stepIndex + 1);
        } else {
          setProgress(old => ({
            ...old,
            completed: Array.from(new Set([...(old.completed || []), level.id])),
            unlocked: Math.max(old.unlocked, level.id + 1)
          }));
          setView("menu");
        }
        setTeacherSolution(false);
      }

      const currentLevel = LEVELS.find(l => l.id === currentLevelId);

      if (view === "welcome") {
        return <Welcome onStart={startProfile} />;
      }

      return (
        <>
          <Header
            profile={profile}
            progress={progress}
            onMenu={() => setView("menu")}
            onTeacher={() => setTeacherOpen(true)}
          />

          {view === "menu" && (
            <MainMenu
              profile={profile}
              progress={progress}
              onStartLevel={startLevel}
              onBoss={() => setView("boss")}
              onResetProfile={() => setView("welcome")}
            />
          )}

          {view === "level" && currentLevel && (
            <LevelView
              level={currentLevel}
              stepIndex={stepIndex}
              setStepIndex={(idx) => {
                setTeacherSolution(false);
                setStepIndex(idx);
              }}
              profile={profile}
              progress={progress}
              updateProgress={updateProgress}
              teacherSolution={teacherSolution}
              onBack={() => setView("menu")}
              onFinished={() => {
                setTeacherSolution(false);
                setView("menu");
              }}
            />
          )}

          {view === "boss" && (
            <BossGame
              profile={profile}
              progress={progress}
              updateProgress={updateProgress}
              onMenu={() => setView("menu")}
              onCertificate={() => setView("certificate")}
            />
          )}

          {view === "certificate" && (
            <Certificate profile={profile} progress={progress} onMenu={() => setView("menu")} />
          )}

          <TeacherMenu
            open={teacherOpen}
            onClose={() => setTeacherOpen(false)}
            onUnlockAll={() => {
              setProgress(old => ({
                ...old,
                unlocked: 11,
                completed: Array.from(new Set([...(old.completed || []), ...LEVELS.map(l => l.id)])),
                certificateUnlocked: true
              }));
            }}
            onSkip={skipCurrent}
            onShowSolution={() => setTeacherSolution(true)}
          />
        </>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
